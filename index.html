<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Генератор мебели</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;margin:0;display:flex;height:100vh;background:#f8fafc;color:#1e293b;font-size:13px}
.side{width:320px;background:#fff;padding:15px;overflow-y:auto;border-right:1px solid #e2e8f0}
.main{flex:1;display:flex;flex-direction:column;padding:15px;overflow:hidden}
h2{margin:0 0 12px;font-size:1.1rem;color:#2563eb}
h3{font-size:.9rem;color:#475569;margin:12px 0 6px;border-bottom:1px solid #e2e8f0;padding-bottom:3px}
.fg{margin-bottom:10px}
label{display:block;font-size:.75rem;font-weight:600;margin-bottom:3px;color:#64748b}
input,select{width:100%;padding:6px;border:1px solid #cbd5e1;border-radius:4px;font-size:.85rem}
.row{display:flex;gap:6px}.row>div{flex:1}
button{width:100%;padding:9px;background:#2563eb;color:#fff;border:none;border-radius:4px;font-weight:600;cursor:pointer;margin-top:6px;font-size:.85rem}
button:hover{background:#1d4ed8}
button.sec{background:#64748b}
#cv{flex:1;background:#e2e8f0;border-radius:6px;min-height:300px}
.tabs{display:flex;gap:3px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:6px 12px;background:#cbd5e1;border:none;border-radius:4px 4px 0 0;cursor:pointer;font-weight:600;font-size:.8rem}
.tab.a{background:#fff;color:#2563eb}
.tc{display:none;background:#fff;padding:15px;border-radius:0 5px 5px 5px;flex:1;overflow-y:auto}
.tc.a{display:block}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:6px;text-align:left;border-bottom:1px solid #e2e8f0}
th{background:#f1f5f9;font-weight:600;font-size:.75rem}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.sb{background:#f1f5f9;padding:8px;border-radius:4px;text-align:center}
.sv{font-size:1rem;font-weight:bold;color:#2563eb}
.sl{font-size:.7rem;color:#64748b}
.cs{border:2px solid #334155;background:#f8fafc;margin-bottom:12px;position:relative}
.cp{position:absolute;background:#fbbf24;border:1px solid #d97706;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;color:#78350f;overflow:hidden}
.total-box{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:15px;border-radius:6px;margin-top:12px;text-align:center}
.total-val{font-size:1.6rem;font-weight:bold}
.breakdown div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #e2e8f0;font-size:.85rem}
</style>
</head>
<body>

<div class="side">
<h2>️ Параметры мебели</h2>

<div class="fg">
<label>Тип мебели</label>
<select id="furnType" onchange="onTypeChange()">
<option value="cabinet">Корпусной шкаф</option>
<option value="built-in-bed">🛏️ Кровать в шкафу</option>
</select>
</div>

<div id="standardBlock">
<div class="fg">
<label>Габариты (мм)</label>
<div class="row">
<div><label>Ширина</label><input type="number" id="width" value="1200"></div>
<div><label>Высота</label><input type="number" id="height" value="2000"></div>
<div><label>Глубина</label><input type="number" id="depth" value="600"></div>
</div>
</div>
</div>

<div id="bedBlock" style="display:none">
<h3>️ Кровать в шкафу</h3>
<div class="row">
<div><label>Ширина шкафа</label><input type="number" id="wardW" value="2400"></div>
<div><label>Высота шкафа</label><input type="number" id="wardH" value="2400"></div>
</div>
<div class="row">
<div><label>Глубина шкафа</label><input type="number" id="wardD" value="450"></div>
</div>
<div class="row">
<div><label>Ширина кровати</label><input type="number" id="bedW" value="1600"></div>
<div><label>Длина кровати</label><input type="number" id="bedL" value="2000"></div>
</div>
<div class="row">
<div><label>Вес матраса (кг)</label><input type="number" id="mattressWeight" value="30"></div>
</div>
</div>

<div class="fg">
<label>Материал</label>
<select id="material">
<option value="16">ЛДСП 16 мм</option>
<option value="18" selected>ЛДСП 18 мм</option>
<option value="22">ЛДСП 22 мм</option>
</select>
</div>

<div class="fg">
<label>Наполнение</label>
<div class="row">
<div><label>Секций</label><input type="number" id="sections" value="2" min="1" max="5"></div>
<div><label>Полок/сек</label><input type="number" id="shelves" value="3" min="0" max="10"></div>
</div>
<div class="row">
<div><label>Ящиков</label><input type="number" id="drawers" value="1" min="0" max="5"></div>
<div><label>Фасад</label>
<select id="doorType">
<option value="hinged">Распашные</option>
<option value="open">Открытый</option>
</select>
</div>
</div>
</div>

<button onclick="generate()">🚀 Сгенерировать проект</button>
<button class="sec" onclick="exportCSV()">📥 Скачать CSV</button>
</div>

<div class="main">
<div id="cv"></div>
<div class="tabs">
<button class="tab a" onclick="sw('parts',this)">Детали</button>
<button class="tab" onclick="sw('cut',this)">Раскрой</button>
<button class="tab" onclick="sw('hw',this)">Фурнитура</button>
<button class="tab" onclick="sw('price',this)">💰 Смета</button>
</div>

<div id="parts" class="tc a">
<div class="st" id="pStats"></div>
<table><thead><tr><th>Деталь</th><th>Длина</th><th>Ширина</th><th>Кол-во</th><th>Кромка</th></tr></thead><tbody id="pT"></tbody></table>
</div>

<div id="cut" class="tc">
<div class="st" id="cStats"></div>
<div id="cMaps"></div>
</div>

<div id="hw" class="tc">
<table><thead><tr><th>Наименование</th><th>Кол-во</th><th>Цена</th><th>Сумма</th><th>Примечание</th></tr></thead><tbody id="hT"></tbody></table>
</div>

<div id="price" class="tc">
<h2>💰 Смета проекта</h2>
<div id="breakdown" class="breakdown"></div>
<div class="total-box">
<div>СЕБЕСТОИМОСТЬ</div>
<div class="total-val" id="totalVal">0 ₽</div>
<div style="font-size:.85rem;opacity:.8;margin-top:5px">Розничная (×1.8): <b id="retailVal">0 ₽</b></div>
</div>
</div>
</div>

<script>
// ========== ПРАЙС ==========
const PRICES = {
    "ЛДСП 16мм (лист 2800×2070)": 2100,
    "ЛДСП 18мм (лист 2800×2070)": 2500,
    "ЛДСП 22мм (лист 2800×2070)": 3200,
    "ХДФ 3мм (лист 2800×2070)": 550,
    "Кромка ПВХ 0,4мм": 10,
    "Кромка ПВХ 2мм": 22,
    "Присадка под конфирмат": 3,
    "Конфирмат 5×50": 2,
    "Шкант 8×30": 1,
    "Саморез 4×30": 1,
    "Петля накладная GTV": 95,
    "Ответная планка": 45,
    "Направляющие GTV 400мм (пара)": 320,
    "Подпятник регулируемый": 35,
    "Ручка мебельная": 250,
    "Полкодержатель": 8,
    "Газлифт 2200N": 1450,
    "Механизм Panto": 8500,
    "Петля трансформерная": 380,
    "Анкерный болт M12×100": 85,
    "Рамка под матрас": 3500,
    "Ламели берёзовые": 120
};

// ========== 3D ==========
let scene, camera, renderer, meshGroup;

function init3D() {
    const c = document.getElementById('cv');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe2e8f0);
    camera = new THREE.PerspectiveCamera(45, c.clientWidth / c.clientHeight, 1, 10000);
    camera.position.set(1500, 1500, 2000);
    camera.lookAt(0, 0, 0);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(c.clientWidth, c.clientHeight);
    c.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const d = new THREE.DirectionalLight(0xffffff, 0.8);
    d.position.set(1000, 2000, 1000);
    scene.add(d);
    meshGroup = new THREE.Group();
    scene.add(meshGroup);
    scene.add(new THREE.GridHelper(3000, 30, 0x94a3b8, 0xcbd5e1));
    (function a() { requestAnimationFrame(a); renderer.render(scene, camera); })();
    window.addEventListener('resize', () => {
        camera.aspect = c.clientWidth / c.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(c.clientWidth, c.clientHeight);
    });
}

function addBox(x, y, z, w, h, d, col = 0xd4a373) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: col, roughness: 0.8 }));
    m.position.set(x, y, z);
    meshGroup.add(m);
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x5c4033 })));
}

// ========== UI ==========
function onTypeChange() {
    const t = document.getElementById('furnType').value;
    document.getElementById('standardBlock').style.display = t === 'cabinet' ? 'block' : 'none';
    document.getElementById('bedBlock').style.display = t === 'built-in-bed' ? 'block' : 'none';
}

function sw(id, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('a'));
    document.querySelectorAll('.tc').forEach(t => t.classList.remove('a'));
    btn.classList.add('a');
    document.getElementById(id).classList.add('a');
}

// ========== ГЕНЕРАЦИЯ ==========
let currentParts = [], currentHardware = [];

function generate() {
    meshGroup.clear();
    currentParts = [];
    currentHardware = [];
    
    const type = document.getElementById('furnType').value;
    const th = parseInt(document.getElementById('material').value);
    
    if (type === 'cabinet') {
        generateCabinet(th);
    } else if (type === 'built-in-bed') {
        generateBuiltInBed(th);
    }
    
    updateUI();
}

function generateCabinet(th) {
    const W = parseInt(document.getElementById('width').value);
    const H = parseInt(document.getElementById('height').value);
    const D = parseInt(document.getElementById('depth').value);
    const sec = parseInt(document.getElementById('sections').value);
    const shS = parseInt(document.getElementById('shelves').value);
    const dr = parseInt(document.getElementById('drawers').value);
    const dt = document.getElementById('doorType').value;
    
    const secW = (W - (sec + 1) * th) / sec;
    const drH = 200;
    const botH = dr > 0 ? dr * drH + (dr + 1) * 20 : 0;
    const upH = H - botH - 2 * th;
    
    // Боковины
    addBox(-W/2 + th/2, H/2, 0, th, H, D, 0xc49a6c);
    addBox(W/2 - th/2, H/2, 0, th, H, D, 0xc49a6c);
    currentParts.push({ n: "Боковина", l: H, w: D, q: 2, eL: 2.0, eW: 0.4 });
    
    // Крышка/дно
    addBox(0, H - th/2, 0, W - 2*th, th, D, 0xc49a6c);
    addBox(0, th/2, 0, W - 2*th, th, D, 0xc49a6c);
    currentParts.push({ n: "Крышка/Дно", l: W - 2*th, w: D, q: 2, eL: 2.0, eW: 2.0 });
    
    // Задняя стенка
    addBox(0, H/2, -D/2 + 1.5, W - 40, H - 40, 3, 0x94a3b8);
    currentParts.push({ n: "Задняя стенка (ХДФ 3мм)", l: H - 40, w: W - 40, q: 1, eL: 0, eW: 0 });
    
    // Перегородки
    for (let i = 1; i < sec; i++) {
        const x = -W/2 + th + i * (secW + th);
        addBox(x, H/2, 0, th, H - 2*th, D - 20, 0xc49a6c);
        currentParts.push({ n: "Перегородка", l: H - 2*th, w: D - 20, q: 1, eL: 2.0, eW: 0.4 });
    }
    
    // Полки
    const shQ = sec * shS;
    for (let s = 0; s < sec; s++) {
        for (let sh = 0; sh < shS; sh++) {
            const y = botH + th + (sh + 1) * (upH / (shS + 1));
            const x = -W/2 + th + s * (secW + th) + secW/2;
            addBox(x, y, 0, secW - 20, th, D - 20, 0xd4a373);
        }
    }
    if (shQ > 0) {
        currentParts.push({ n: "Полка", l: secW - 20, w: D - 20, q: shQ, eL: 2.0, eW: 0.4 });
    }
    
    // Ящики
    if (dr > 0) {
        const drW = secW - 26;
        const drD = D - 100;
        for (let d = 0; d < dr; d++) {
            const y = th + 20 + d * (drH + 20) + drH/2;
            addBox(0, y, 0, drW, drH - 26, 16, 0xe2c79c);
        }
        currentParts.push({ n: "Боковина ящика", l: drD, w: drH - 26, q: dr * 2, eL: 0.4, eW: 0.4 });
        currentParts.push({ n: "Перед/Зад ящика", l: drW - 32, w: drH - 26, q: dr * 2, eL: 0.4, eW: 0.4 });
        currentParts.push({ n: "Дно ящика (ХДФ)", l: drW - 16, w: drD - 16, q: dr, eL: 0, eW: 0 });
    }
    
    // Фасады
    if (dt === 'hinged') {
        const dH = H - 4;
        const dW = (W / sec) - 4;
        for (let i = 0; i < sec; i++) {
            const x = -W/2 + (W/sec)/2 + i * (W/sec);
            addBox(x, H/2, D/2 + 1, dW, dH, 20, 0x3b82f6);
        }
        currentParts.push({ n: "Фасад", l: dH, w: dW, q: sec, eL: 2.0, eW: 2.0 });
    }
    
    // Фурнитура
    const conf = (2 + sec - 1) * 4 + (shQ * 2) + (dr * 8);
    const hinges = dt === 'hinged' ? sec * (H > 1500 ? 3 : 2) : 0;
    const slides = dr * 2;
    
    currentHardware = [
        { n: "Конфирмат 5×50", q: conf, note: "Основной крепёж" },
        { n: "Шкант 8×30", q: conf, note: "Доп. фиксация" },
        { n: "Петля накладная GTV", q: hinges, note: H > 1500 ? "3 шт/дверь" : "2 шт/дверь" },
        { n: "Ответная планка", q: hinges, note: "В пару к петлям" },
        { n: "Направляющие GTV 400мм (пара)", q: slides, note: "пар" },
        { n: "Подпятник регулируемый", q: 4, note: "На дно" },
        { n: "Саморез 4×30", q: hinges * 2 + dr * 4, note: "Для петель" },
        { n: "Полкодержатель", q: shQ * 4, note: "4 на полку" }
    ];
    if (dt === 'hinged') {
        currentHardware.push({ n: "Ручка мебельная", q: sec, note: "На каждый фасад" });
    }
}

function generateBuiltInBed(th) {
    const W = parseInt(document.getElementById('wardW').value);
    const H = parseInt(document.getElementById('wardH').value);
    const D = parseInt(document.getElementById('wardD').value);
    const bedW = parseInt(document.getElementById('bedW').value);
    const bedL = parseInt(document.getElementById('bedL').value);
    const mattressWeight = parseInt(document.getElementById('mattressWeight').value);
    
    // Корпус шкафа
    addBox(-W/2 + th/2, H/2, 0, th, H, D, 0xc49a6c);
    addBox(W/2 - th/2, H/2, 0, th, H, D, 0xc49a6c);
    currentParts.push({ n: "Боковина шкафа", l: H, w: D, q: 2, eL: 2.0, eW: 0.4 });
    
    addBox(0, H - th/2, 0, W - 2*th, th, D, 0xc49a6c);
    addBox(0, th/2, 0, W - 2*th, th, D, 0xc49a6c);
    currentParts.push({ n: "Крышка/Дно шкафа", l: W - 2*th, w: D, q: 2, eL: 2.0, eW: 2.0 });
    
    addBox(0, H/2, -D/2 + 1.5, W - 20, H - 20, 3, 0x94a3b8);
    currentParts.push({ n: "Задняя стенка (ХДФ)", l: H - 20, w: W - 20, q: 1, eL: 0, eW: 0 });
    
    // Кровать (в сложенном виде — вертикально)
    const bedBottomY = 400;
    addBox(0, bedBottomY + bedL/2 + th, 0, bedW, bedL, 100, 0x3b82f6);
    addBox(0, bedBottomY + bedL/2 + th, D/2 + 1, bedW - 4, bedL - 4, 20, 0x0ea5e9);
    currentParts.push({ n: "Рама кровати", l: bedL, w: bedW, q: 1, eL: 2.0, eW: 2.0 });
    currentParts.push({ n: "Фасад кровати", l: bedL - 4, w: bedW - 4, q: 1, eL: 2.0, eW: 2.0 });
    
    // Расчёт газлифтов
    const frameWeight = (bedW * bedL * th * 0.7) / 1000;
    const totalWeight = mattressWeight + frameWeight;
    const gasliftForce = totalWeight * 9.81 * 1.15;
    
    currentHardware = [
        { n: "Конфирмат 5×50", q: 60, note: "Корпус" },
        { n: "Шкант 8×30", q: 60, note: "Фиксация" },
        { n: "Газлифт 2200N", q: 2, note: `${totalWeight.toFixed(1)} кг, ${gasliftForce.toFixed(0)}N` },
        { n: "Механизм Panto", q: 1, note: "Комплект" },
        { n: "Петля трансформерная", q: 4, note: "Для рамы" },
        { n: "Анкерный болт M12×100", q: 6, note: "К стене" },
        { n: "Рамка под матрас", q: 1, note: `${bedW}×${bedL}` },
        { n: "Ламели берёзовые", q: Math.floor(bedL/100), note: "Через 100 мм" }
    ];
}

// ========== UI ОБНОВЛЕНИЕ ==========
function updateUI() {
    // Деталировка
    const g = {};
    currentParts.forEach(p => {
        const k = `${p.n}|${p.l}|${p.w}`;
        if (!g[k]) g[k] = { ...p, q: 0 };
        g[k].q += p.q;
    });
    let tot = 0;
    document.getElementById('pT').innerHTML = Object.values(g).map(p => {
        tot += p.q;
        return `<tr><td>${p.n}</td><td>${p.l}</td><td>${p.w}</td><td>${p.q}</td><td>${p.eL}/${p.eW} мм</td></tr>`;
    }).join('');
    document.getElementById('pStats').innerHTML = `
        <div class="sb"><div class="sv">${Object.keys(g).length}</div><div class="sl">Уникальных</div></div>
        <div class="sb"><div class="sv">${tot}</div><div class="sl">Всего деталей</div></div>
        <div class="sb"><div class="sv">${document.getElementById('material').value}мм</div><div class="sl">Материал</div></div>
        <div class="sb"><div class="sv">${currentHardware.length}</div><div class="sl">Позиций фурнитуры</div></div>
    `;
    
    // Фурнитура
    document.getElementById('hT').innerHTML = currentHardware.map(h => {
        const pr = PRICES[h.n] || 0;
        return `<tr><td>${h.n}</td><td>${h.q}</td><td>${pr} ₽</td><td><b>${(pr * h.q).toFixed(0)} ₽</b></td><td>${h.note}</td></tr>`;
    }).join('');
    
    runCutting();
    calcTotal();
}

// ========== РАСКРОЙ ==========
function runCutting() {
    const sW = 2800, sH = 2070, kerf = 4;
    let parts = [];
    currentParts.forEach(p => {
        if (!p.n.includes("ХДФ")) {
            for (let i = 0; i < p.q; i++) parts.push({ w: p.l, h: p.w, n: p.n });
        }
    });
    parts.sort((a, b) => (b.w * b.h) - (a.w * a.h));
    
    const sheets = [];
    let cur = { p: [], fr: [{ x: 0, y: 0, w: sW, h: sH }] };
    
    parts.forEach(pt => {
        let placed = false;
        for (let s of sheets) {
            if (tryP(s, pt, kerf)) { placed = true; break; }
        }
        if (!placed) {
            if (tryP(cur, pt, kerf)) {
                sheets.push(cur);
                cur = { p: [], fr: [{ x: 0, y: 0, w: sW, h: sH }] };
            }
        }
    });
    if (cur.p.length) sheets.push(cur);
    
    const scale = 500 / sW;
    const cMaps = document.getElementById('cMaps');
    cMaps.innerHTML = '';
    let used = 0;
    
    sheets.forEach((s, i) => {
        const d = document.createElement('div');
        d.className = 'cs';
        d.style.width = (sW * scale) + 'px';
        d.style.height = (sH * scale) + 'px';
        s.p.forEach(p => {
            const e = document.createElement('div');
            e.className = 'cp';
            e.style.left = (p.x * scale) + 'px';
            e.style.top = (p.y * scale) + 'px';
            e.style.width = (p.w * scale) + 'px';
            e.style.height = (p.h * scale) + 'px';
            e.innerText = `${p.n}\n${p.w}×${p.h}`;
            d.appendChild(e);
            used += p.w * p.h;
        });
        const lb = document.createElement('div');
        lb.style.cssText = 'position:absolute;top:-20px;font-weight:bold';
        lb.innerText = `Лист ${i + 1}`;
        d.appendChild(lb);
        cMaps.appendChild(d);
    });
    
    const sArea = sW * sH;
    const eff = ((used / (sheets.length * sArea)) * 100).toFixed(1);
    document.getElementById('cStats').innerHTML = `
        <div class="sb"><div class="sv">${sheets.length}</div><div class="sl">Листов</div></div>
        <div class="sb"><div class="sv">${eff}%</div><div class="sl">Эффективность</div></div>
        <div class="sb"><div class="sv">${((sheets.length * sArea - used) / 1e6).toFixed(2)} м²</div><div class="sl">Отходы</div></div>
        <div class="sb"><div class="sv">${parts.length}</div><div class="sl">Деталей</div></div>
    `;
}

function tryP(s, pt, k) {
    for (let i = 0; i < s.fr.length; i++) {
        const r = s.fr[i];
        if (pt.w <= r.w && pt.h <= r.h) { pl(s, pt, r, k, false); return true; }
        if (pt.h <= r.w && pt.w <= r.h) { pl(s, pt, r, k, true); return true; }
    }
    return false;
}

function pl(s, pt, r, k, rot) {
    const w = rot ? pt.h : pt.w, h = rot ? pt.w : pt.h;
    s.p.push({ x: r.x, y: r.y, w, h, n: pt.n });
    s.fr.splice(s.fr.indexOf(r), 1);
    if (r.w - w - k > 0) s.fr.push({ x: r.x + w + k, y: r.y, w: r.w - w - k, h });
    if (r.h - h - k > 0) s.fr.push({ x: r.x, y: r.y + h + k, w: r.w, h: r.h - h - k });
    s.fr.sort((a, b) => (a.y - b.y) || (a.x - b.x));
}

// ========== СМЕТА ==========
function calcTotal() {
    const sW = 2800, sH = 2070;
    let matCost = 0, edgeCost = 0, hardCost = 0, drillCost = 0;
    
    let totalArea = 0;
    currentParts.forEach(p => {
        if (p.n.includes("ХДФ")) return;
        totalArea += (p.l * p.w * p.q) / 1e6;
        const edgeLm = ((p.l * p.eL * 2 + p.w * p.eW * 2) * p.q) / 1000;
        if (p.eL === 2.0 || p.eW === 2.0) edgeCost += edgeLm * PRICES["Кромка ПВХ 2мм"];
        if (p.eL === 0.4 || p.eW === 0.4) edgeCost += edgeLm * PRICES["Кромка ПВХ 0,4мм"];
    });
    
    const sheetsNeeded = Math.ceil(totalArea / ((sW * sH) / 1e6));
    const matKey = `ЛДСП ${document.getElementById('material').value}мм (лист 2800×2070)`;
    matCost = sheetsNeeded * PRICES[matKey];
    
    const hdfParts = currentParts.filter(p => p.n.includes("ХДФ"));
    let hdfArea = hdfParts.reduce((s, p) => s + (p.l * p.w * p.q) / 1e6, 0);
    if (hdfArea > 0) matCost += Math.ceil(hdfArea / ((sW * sH) / 1e6)) * PRICES["ХДФ 3мм (лист 2800×2070)"];
    
    drillCost = currentParts.length * 4 * PRICES["Присадка под конфирмат"];
    currentHardware.forEach(h => hardCost += (PRICES[h.n] || 0) * h.q);
    
    const total = matCost + edgeCost + hardCost + drillCost;
    document.getElementById('breakdown').innerHTML = `
        <div><span>🪵 Материалы (${sheetsNeeded} л. ЛДСП + ХДФ)</span><b>${matCost.toFixed(0)} ₽</b></div>
        <div><span> Кромление</span><b>${edgeCost.toFixed(0)} ₽</b></div>
        <div><span>🔧 Присадка</span><b>${drillCost.toFixed(0)} ₽</b></div>
        <div><span>🔩 Фурнитура</span><b>${hardCost.toFixed(0)} ₽</b></div>
    `;
    document.getElementById('totalVal').textContent = total.toFixed(0) + ' ₽';
    document.getElementById('retailVal').textContent = (total * 1.8).toFixed(0) + ' ₽';
}

// ========== CSV ==========
function exportCSV() {
    let c = "Деталь,Длина,Ширина,Кол-во,Кромка Дл,Кромка Шир\n";
    currentParts.forEach(p => c += `${p.n},${p.l},${p.w},${p.q},${p.eL},${p.eW}\n`);
    c += "\nФурнитура,Кол-во,Цена,Сумма,Примечание\n";
    currentHardware.forEach(h => {
        const pr = PRICES[h.n] || 0;
        c += `${h.n},${h.q},${pr},${(pr * h.q).toFixed(0)},${h.note}\n`;
    });
    const b = new Blob([c], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'проект.csv';
    a.click();
}

// ========== ЗАПУСК ==========
init3D();
generate();
</script>
