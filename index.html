<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Конструктор мебели Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪑</text></svg>">
<style>
*{box-sizing:border-box}
body{font-family:system-ui;margin:0;display:flex;height:100vh;background:#f8fafc;color:#1e293b;font-size:13px}
.side{width:400px;background:#fff;padding:12px;overflow-y:auto;border-right:1px solid #e2e8f0}
.main{flex:1;display:flex;flex-direction:column;padding:12px;overflow:hidden}
h2{margin:0 0 10px;font-size:1.1rem;color:#2563eb}
h3{font-size:.85rem;color:#475569;margin:10px 0 5px;border-bottom:1px solid #e2e8f0;padding-bottom:3px}
.fg{margin-bottom:8px}
label{display:block;font-size:.72rem;font-weight:600;margin-bottom:2px;color:#64748b}
input,select,textarea{width:100%;padding:5px;border:1px solid #cbd5e1;border-radius:4px;font-size:.82rem;font-family:inherit}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:5px}.row>div{flex:1}
button{width:100%;padding:8px;background:#2563eb;color:#fff;border:none;border-radius:4px;font-weight:600;cursor:pointer;margin-top:5px;font-size:.82rem}
button:hover{background:#1d4ed8}
button.sec{background:#64748b}
button.ai{background:linear-gradient(135deg,#7e22ce,#a855f7)}
button.danger{background:#ef4444}
button.success{background:#10b981}
button.warn{background:#f59e0b}
button.small{width:auto;padding:4px 10px;font-size:.75rem;margin:0}
button.active{background:#10b981 !important}
#cv{flex:1;background:#e2e8f0;border-radius:6px;min-height:300px;position:relative}
.view-toggle{position:absolute;top:8px;right:8px;z-index:10;display:flex;gap:4px;flex-wrap:wrap}
.view-toggle button{width:auto;padding:5px 10px;font-size:.72rem;margin:0}
.tabs{display:flex;gap:2px;margin-bottom:8px;flex-wrap:wrap}
.tab{padding:5px 10px;background:#cbd5e1;border:none;border-radius:4px 4px 0 0;cursor:pointer;font-weight:600;font-size:.78rem}
.tab.a{background:#fff;color:#2563eb}
.tc{display:none;background:#fff;padding:12px;border-radius:0 5px 5px 5px;flex:1;overflow-y:auto}
.tc.a{display:block}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{padding:5px;text-align:left;border-bottom:1px solid #e2e8f0}
th{background:#f1f5f9;font-weight:600;font-size:.72rem}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.sb{background:#f1f5f9;padding:6px;border-radius:4px;text-align:center}
.sv{font-size:.95rem;font-weight:bold;color:#2563eb}
.sl{font-size:.68rem;color:#64748b}
.comp-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:4px;padding:8px;margin-bottom:6px}
.comp-header{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.82rem}
.badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:.68rem;font-weight:600}
.badge-custom{background:#c084fc;color:#fff}
.badge-block{background:#10b981;color:#fff}
.edit-panel{position:absolute;bottom:10px;left:10px;right:10px;background:#fff;border:2px solid #2563eb;border-radius:8px;padding:12px;z-index:20;box-shadow:0 4px 20px rgba(0,0,0,0.15);max-height:280px;overflow-y:auto;transition:border-color 0.3s}
.edit-panel.hidden{display:none}
.edit-panel h4{margin:0 0 8px;color:#2563eb;font-size:.95rem}
.edit-panel .row{margin-bottom:6px}
.edit-panel input{padding:4px;font-size:.8rem}
.edit-panel .edit-actions{display:flex;gap:5px;margin-top:8px}
.edit-panel .edit-actions button{flex:1}
.selected-info{position:absolute;top:10px;left:10px;background:#fff;border:1px solid #2563eb;border-radius:6px;padding:6px 12px;font-size:.78rem;z-index:20;max-width:60%}
.selected-info.hidden{display:none}
.hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#fff;padding:6px 12px;border-radius:20px;font-size:.75rem;z-index:20;pointer-events:none}
.hint.hidden{display:none}
.dim-label{position:absolute;color:#1e293b;font-size:11px;font-weight:bold;background:rgba(255,255,255,0.95);padding:3px 6px;border-radius:3px;border:1px solid #2563eb;pointer-events:none;white-space:nowrap;z-index:100}
.sketch-box{background:#f0f9ff;border:1px solid #7dd3fc;border-radius:4px;padding:10px;margin-top:8px}
.sketch-box canvas{max-width:100%;max-height:150px;border:1px solid #cbd5e1;border-radius:4px;margin-top:5px}
.sketch-result{background:#d1fae5;border:1px solid #10b981;border-radius:4px;padding:10px;margin-top:8px;font-size:.8rem}
.sketch-result b{color:#065f46}
.file-input-wrapper{position:relative;overflow:hidden;display:inline-block;width:100%}
.file-input-wrapper input[type=file]{position:absolute;left:-9999px}
.file-input-label{display:block;padding:8px;background:#f1f5f9;border:2px dashed #cbd5e1;border-radius:4px;text-align:center;cursor:pointer;font-size:.82rem;color:#64748b}
.file-input-label:hover{background:#e2e8f0;border-color:#94a3b8}
.parse-result{background:#d1fae5;border:1px solid #10b981;border-radius:4px;padding:10px;margin-top:8px;font-size:.78rem;display:none}
.parse-result b{color:#065f46}
.example-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{background:#e0e7ff;color:#3730a3;padding:4px 8px;border-radius:12px;font-size:.72rem;cursor:pointer;border:1px solid #c7d2fe}
.chip:hover{background:#c7d2fe}
.transform-controls{position:absolute;top:10px;left:10px;z-index:20;display:flex;gap:4px}
.transform-controls button{width:auto;padding:6px 12px;font-size:.75rem;margin:0}
</style>
</head>
<body>

<div class="side">
<h2>🪑 Конструктор мебели</h2>

<div class="fg">
<label>🤖 Опишите мебель</label>
<textarea id="aiDescription" placeholder="Например: стеллаж ширина 150 высота 1700 глубина 600 4 полки..."></textarea>
<div class="example-chips">
<span class="chip" onclick="setExample('стеллаж ширина 150 высота 1700 глубина 600 полки на высотах 300 600 900 1200')">📚 Стеллаж</span>
<span class="chip" onclick="setExample('стол ширина 1200 глубина 600 высота 750')">🍽️ Стол</span>
<span class="chip" onclick="setExample('шкаф ширина 1200 глубина 600 высота 2000 3 полки')">🗄️ Шкаф</span>
<span class="chip" onclick="setExample('тумба ширина 500 глубина 400 высота 800 с 3 ящиками')">🗃️ Тумба</span>
<span class="chip" onclick="setExample('стул сиденье 450x400 высота 450 со спинкой')">🪑 Стул</span>
</div>
<button class="ai" onclick="buildFromDescription()">🚀 Построить</button>
<div id="parseResult" class="parse-result"></div>
</div>

<div class="fg">
<label>🎨 Загрузите эскиз (JPG/PNG)</label>
<div class="file-input-wrapper">
<input type="file" id="sketchUpload" accept="image/*" onchange="loadSketch(event)">
<label for="sketchUpload" class="file-input-label">📁 Нажмите для загрузки<br><small>JPG или PNG</small></label>
</div>
<div id="sketchPreview" style="display:none" class="sketch-box">
<canvas id="sketchCanvas"></canvas>
<button class="success" onclick="analyzeSketch()" style="margin-top:8px">🔍 Распознать и построить</button>
<div id="sketchResult" style="display:none" class="sketch-result"></div>
</div>
</div>

<div class="fg">
<label>📋 Или выберите шаблон</label>
<select id="template" onchange="loadTemplate()">
<option value="">— Выберите —</option>
<option value="simple-table">🍽️ Стол</option>
<option value="chair">🪑 Стул</option>
<option value="cabinet">🗄️ Шкаф</option>
</select>
</div>

<h3>📦 Блоки мебели</h3>
<button class="warn" onclick="createBlockFromSelected()">➕ Создать блок из выделенного</button>
<div id="blocksList" style="margin-top:8px"></div>

<h3>🧩 Компоненты (<span id="compCount">0</span>)</h3>
<div id="componentsList"></div>

<div class="fg">
<label>Материал</label>
<select id="material" onchange="updateUI()">
<option value="16">ЛДСП 16 мм</option>
<option value="18" selected>ЛДСП 18 мм</option>
<option value="22">ЛДСП 22 мм</option>
</select>
</div>

<button class="sec" onclick="exportCSV()">📥 Экспорт CSV</button>
<button class="danger" onclick="clearAll()">🗑️ Очистить всё</button>
</div>

<div class="main">
<div id="cv">
<div class="hint" id="hint">💡 Кликните по детали в 3D для редактирования</div>
<div class="selected-info hidden" id="selectedInfo"></div>
<div class="transform-controls hidden" id="transformControls">
<button class="sec active" id="btnTranslate" onclick="setTransformMode('translate')">↔️ Двигать</button>
<button class="sec" id="btnRotate" onclick="setTransformMode('rotate')">🔄 Вращать</button>
<button class="sec" onclick="detachTransform()">✕</button>
</div>
<div class="edit-panel hidden" id="editPanel">
<h4>✏️ Редактирование: <span id="editName"></span></h4>
<div id="editModeIndicator" style="font-size:.75rem;color:#64748b;margin-bottom:8px"></div>
<div class="row">
<div><label>Длина (X)</label><input type="number" id="editL"></div>
<div><label>Ширина (Z)</label><input type="number" id="editW"></div>
<div><label>Высота (Y)</label><input type="number" id="editTh"></div>
</div>
<div class="row">
<div><label>Позиция X</label><input type="number" id="editX"></div>
<div><label>Позиция Y</label><input type="number" id="editY"></div>
<div><label>Позиция Z</label><input type="number" id="editZ"></div>
</div>
<div class="row">
<div><label>Поворот X°</label><input type="number" id="editRotX" step="15" value="0"></div>
<div><label>Поворот Y°</label><input type="number" id="editRotY" step="15" value="0"></div>
<div><label>Поворот Z°</label><input type="number" id="editRotZ" step="15" value="0"></div>
</div>
<div class="row">
<div><label>Цвет</label>
<select id="editColor">
<option value="0xd4a373">Дерево светлое</option>
<option value="0x8b6f47">Дерево тёмное</option>
<option value="0x3b82f6">Синий</option>
<option value="0x10b981">Зелёный</option>
<option value="0x94a3b8">Серый</option>
<option value="0xef4444">Красный</option>
</select>
</div>
</div>
<div class="edit-actions">
<button class="success" onclick="applyEdit()">✅ Применить</button>
<button class="warn" onclick="duplicateSelected()">📋 Копировать</button>
<button class="danger" onclick="deleteSelected()">🗑️ Удалить</button>
<button class="sec" onclick="closeEditPanel()" style="flex:0.5">✕</button>
</div>
</div>
<div class="view-toggle">
<button onclick="toggleView('assembled')">📦 Собрано</button>
<button onclick="toggleView('exploded')">💥 Разобрано</button>
<button onclick="toggleView('dimensions')">📐 Размеры</button>
</div>
</div>
<div class="tabs">
<button class="tab a" onclick="sw('parts',this)">Детали</button>
<button class="tab" onclick="sw('cut',this)">Раскрой</button>
<button class="tab" onclick="sw('hw',this)">Фурнитура</button>
<button class="tab" onclick="sw('price',this)">💰 Смета</button>
</div>

<div id="parts" class="tc a">
<div class="st" id="pStats"></div>
<table><thead><tr><th>Деталь</th><th>Длина</th><th>Ширина</th><th>Высота</th><th>Кол-во</th></tr></thead><tbody id="pT"></tbody></table>
</div>

<div id="cut" class="tc">
<div class="st" id="cStats"></div>
<div id="cMaps"></div>
</div>

<div id="hw" class="tc">
<table><thead><tr><th>Наименование</th><th>Кол-во</th><th>Цена</th><th>Сумма</th><th>Примечание</th></tr></thead><tbody id="hT"></tbody></table>
</div>

<div id="price" class="tc">
<h2>💰 Смета</h2>
<div id="breakdown"></div>
<div style="background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:12px;border-radius:6px;margin-top:10px;text-align:center">
<div>СЕБЕСТОИМОСТЬ</div>
<div style="font-size:1.4rem;font-weight:bold" id="totalVal">0 ₽</div>
<div style="font-size:.82rem;opacity:.8;margin-top:4px">Розничная (×1.8): <b id="retailVal">0 ₽</b></div>
</div>
</div>
</div>

<script>
const PRICES = {
    "ЛДСП 16мм (лист 2800×2070)": 2100,
    "ЛДСП 18мм (лист 2800×2070)": 2500,
    "ЛДСП 22мм (лист 2800×2070)": 3200,
    "Кромка ПВХ 0,4мм": 10,
    "Кромка ПВХ 2мм": 22,
    "Присадка под конфирмат": 3,
    "Конфирмат 5×50": 2,
    "Петля рояльная 300мм": 180,
    "Петля рояльная 500мм": 240,
    "Петля рояльная 1000мм": 420,
    "Кронштейн откидной": 280,
    "Ножка мебельная": 180,
    "Направляющие для ящика (пара)": 380,
    "Ручка для ящика": 120,
    "Вырез под трубу (фрезеровка)": 150,
    "Колёсико мебельное": 85
};

let scene, camera, renderer, meshGroup, controls, transformControl;
let components = [];
let blocks = [];
let currentView = 'assembled';
let dimLabels = [];
let meshToComponent = new Map();
let selectedComponentIdx = -1;
let selectedBlockIdx = -1;
let selectedMesh = null;
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let currentTransformMode = 'translate';

function setExample(text) {
    document.getElementById('aiDescription').value = text;
}

function init3D() {
    const c = document.getElementById('cv');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe2e8f0);
    camera = new THREE.PerspectiveCamera(45, c.clientWidth / c.clientHeight, 1, 10000);
    camera.position.set(2000, 1500, 2000);
    camera.lookAt(0, 800, 0);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(c.clientWidth, c.clientHeight);
    c.appendChild(renderer.domElement);
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 800, 0);
    transformControl = new THREE.TransformControls(camera, renderer.domElement);
    transformControl.setSize(0.75);
    transformControl.addEventListener('dragging-changed', function(event) {
        controls.enabled = !event.value;
    });
    transformControl.addEventListener('change', function() {
        if (selectedMesh && selectedComponentIdx >= 0) updateComponentFromTransform();
    });
    scene.add(transformControl);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const d = new THREE.DirectionalLight(0xffffff, 0.8);
    d.position.set(1000, 2000, 1000);
    scene.add(d);
    meshGroup = new THREE.Group();
    scene.add(meshGroup);
    scene.add(new THREE.GridHelper(4000, 40, 0x94a3b8, 0xcbd5e1));
    renderer.domElement.addEventListener('click', onMeshClick);
    renderer.domElement.addEventListener('dblclick', onMeshDblClick);
    (function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); updateDimLabels(); })();
    window.addEventListener('resize', () => { camera.aspect = c.clientWidth / c.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(c.clientWidth, c.clientHeight); });
}

function addBox3D(x, y, z, sx, sy, sz, col, rotX, rotY, rotZ, compIdx) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), new THREE.MeshStandardMaterial({ color: col, roughness: 0.8 }));
    m.position.set(x, y, z);
    if (rotX) m.rotation.x = rotX * Math.PI / 180;
    if (rotY) m.rotation.y = rotY * Math.PI / 180;
    if (rotZ) m.rotation.z = rotZ * Math.PI / 180;
    m.userData.compIdx = compIdx;
    meshGroup.add(m);
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x5c4033 })));
    meshToComponent.set(m, compIdx);
    return m;
}

function clearDimLabels() {
    dimLabels.forEach(item => { if (item.label && item.label.parentNode) item.label.parentNode.removeChild(item.label); });
    dimLabels = [];
}

function addDimLabel(x, y, z, text) {
    const cv = document.getElementById('cv');
    const label = document.createElement('div');
    label.className = 'dim-label';
    label.textContent = text;
    cv.appendChild(label);
    dimLabels.push({ label: label, pos: new THREE.Vector3(x, y, z) });
}

function updateDimLabels() {
    if (currentView !== 'dimensions') { clearDimLabels(); return; }
    const cv = document.getElementById('cv');
    const w = cv.clientWidth, h = cv.clientHeight;
    dimLabels.forEach(item => {
        const v = item.pos.clone();
        v.project(camera);
        const x = (v.x * 0.5 + 0.5) * w;
        const y = (-v.y * 0.5 + 0.5) * h;
        if (v.z > 1) { item.label.style.display = 'none'; return; }
        item.label.style.display = 'block';
        item.label.style.left = (x - item.label.offsetWidth / 2) + 'px';
        item.label.style.top = (y - item.label.offsetHeight / 2) + 'px';
    });
}

function setTransformMode(mode) {
    currentTransformMode = mode;
    transformControl.setMode(mode);
    document.getElementById('btnTranslate').classList.toggle('active', mode === 'translate');
    document.getElementById('btnRotate').classList.toggle('active', mode === 'rotate');
}

function attachTransformToMesh(mesh) {
    transformControl.attach(mesh);
    setTransformMode(currentTransformMode);
    document.getElementById('transformControls').classList.remove('hidden');
}

function detachTransform() {
    transformControl.detach();
    document.getElementById('transformControls').classList.add('hidden');
}

function updateComponentFromTransform() {
    if (!selectedMesh || selectedComponentIdx < 0) return;
    const comp = components[selectedComponentIdx];
    if (!comp) return;
    comp.x = selectedMesh.position.x;
    comp.y = selectedMesh.position.y - comp.th / 2;
    comp.z = selectedMesh.position.z;
    comp.rotX = Math.round(selectedMesh.rotation.x * 180 / Math.PI);
    comp.rotY = Math.round(selectedMesh.rotation.y * 180 / Math.PI);
    comp.rotZ = Math.round(selectedMesh.rotation.z * 180 / Math.PI);
    document.getElementById('editX').value = Math.round(comp.x);
    document.getElementById('editY').value = Math.round(comp.y);
    document.getElementById('editZ').value = Math.round(comp.z);
    document.getElementById('editRotX').value = comp.rotX;
    document.getElementById('editRotY').value = comp.rotY;
    document.getElementById('editRotZ').value = comp.rotZ;
    const info = document.getElementById('selectedInfo');
    info.innerHTML = `<b>🔄 Перемещение:</b> ${comp.name} <span style="color:#10b981">(${Math.round(comp.x)}, ${Math.round(comp.y)}, ${Math.round(comp.z)})</span>`;
}

function parseDescription(text) {
    const t = ' ' + text.toLowerCase() + ' ';
    const result = {
        type: 'table', width: 1200, depth: 600, height: 750,
        shelfCount: 0, shelfHeights: [], drawerCount: 0, legCount: 4,
        hasFacade: false, hasHoles: false, hasWheels: false, hasRod: false, hasLift: false, log: []
    };
    if (t.includes(' стеллаж ') || t.includes(' стелаж ')) {
        result.type = 'cabinet'; result.log.push('Тип: стеллаж');
    } else if (t.includes(' шкаф ') || t.includes(' купе ')) {
        result.type = 'cabinet'; result.log.push('Тип: шкаф');
    } else if (t.includes(' тумб') || t.includes(' комод')) {
        result.type = 'cabinet'; result.log.push('Тип: тумба/комод');
    } else if (t.includes(' стул') || t.includes(' кресло')) {
        result.type = 'chair'; result.log.push('Тип: стул');
    } else if (t.includes(' стол ') || t.includes(' столешниц')) {
        result.type = 'table'; result.log.push('Тип: стол');
    } else {
        result.log.push('Тип: по умолчанию (стол)');
    }
    const widthMatch = t.match(/ширин[ауой]\s+(\d{2,4})/) || t.match(/(\d{2,4})\s*[×xх]\s*\d{2,4}/);
    if (widthMatch) { result.width = parseInt(widthMatch[1]); result.log.push(`Ширина: ${result.width}`); }
    const depthMatch = t.match(/глубин[аеой]\s+(\d{2,4})/) || t.match(/\d{2,4}\s*[×xх]\s*(\d{2,4})/);
    if (depthMatch) { result.depth = parseInt(depthMatch[1]); result.log.push(`Глубина: ${result.depth}`); }
    const heightMatch = t.match(/высот[аеой]\s+(\d{2,4})/);
    if (heightMatch) { result.height = parseInt(heightMatch[1]); result.log.push(`Высота: ${result.height}`); }
    const shelfCountMatch = t.match(/(\d+)\s*полк/);
    if (shelfCountMatch) { result.shelfCount = parseInt(shelfCountMatch[1]); result.log.push(`Полок: ${result.shelfCount}`); }
    const shelfDistMatch = t.match(/(?:расстояни[ея]\s*(?:между\s*)?полк[аи]|полки\s*на\s*высотах)\s+((?:\d{2,4}\s*)+)/);
    if (shelfDistMatch) {
        result.shelfHeights = shelfDistMatch[1].trim().split(/\s+/).map(n => parseInt(n)).filter(n => !isNaN(n) && n > 0);
        result.log.push(`Высоты полок: ${result.shelfHeights.join(', ')}`);
    }
    const drawerMatch = t.match(/(\d+)\s*ящик/);
    if (drawerMatch) { result.drawerCount = parseInt(drawerMatch[1]); result.log.push(`Ящиков: ${result.drawerCount}`); }
    if (t.includes(' фасад') || t.includes(' дверц')) { result.hasFacade = true; result.log.push('Есть фасад'); }
    return result;
}

function buildFromDescription() {
    const desc = document.getElementById('aiDescription').value.trim();
    if (!desc) { alert('Введите описание мебели'); return; }
    const parsed = parseDescription(desc);
    const resultDiv = document.getElementById('parseResult');
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `<b>✅ Распознано:</b><br>` + parsed.log.map(l => `• ${l}`).join('<br>') + `<br><b>Итого:</b> ${parsed.type}, ${parsed.width}×${parsed.depth}×${parsed.height} мм`;
    components = buildComponents(parsed);
    blocks = [];
    renderComponentsList();
    renderBlocksList();
    rebuild3D();
    updateUI();
    camera.position.set(2000, 1500, 2000);
    controls.target.set(0, parsed.height / 2, 0);
}

function buildComponents(p) {
    const comps = [];
    const W = p.width, D = p.depth, H = p.height;
    if (p.type === 'table') {
        comps.push({ type: 'slab', name: 'Столешница', l: W, w: D, th: 20, x: 0, y: H - 20, z: 0, color: '0xd4a373', rotX: 0, rotY: 0, rotZ: 0 });
        const legPositions = [[-W/2+50,-D/2+50],[W/2-50,-D/2+50],[-W/2+50,D/2-50],[W/2-50,D/2-50]];
        for (let i = 0; i < 4; i++) {
            comps.push({ type: 'leg', name: `Опора ${i+1}`, l: 50, w: 50, th: H - 20, x: legPositions[i][0], y: 0, z: legPositions[i][1], color: '0x94a3b8', rotX: 0, rotY: 0, rotZ: 0 });
        }
    } else if (p.type === 'chair') {
        comps.push({ type: 'slab', name: 'Сиденье', l: W, w: D, th: 20, x: 0, y: H - 20, z: 0, color: '0xd4a373', rotX: 0, rotY: 0, rotZ: 0 });
        const legPositions = [[-W/2+30,-D/2+30],[W/2-30,-D/2+30],[-W/2+30,D/2-30],[W/2-30,D/2-30]];
        legPositions.forEach((pos, i) => {
            comps.push({ type: 'leg', name: `Ножка ${i+1}`, l: 40, w: 40, th: H - 20, x: pos[0], y: 0, z: pos[1], color: '0x94a3b8', rotX: 0, rotY: 0, rotZ: 0 });
        });
        comps.push({ type: 'slab', name: 'Спинка', l: 20, w: D - 40, th: Math.min(400, H), x: 0, y: H, z: -D/2 + 20, color: '0xc49a6c', rotX: 0, rotY: 0, rotZ: 0 });
    } else {
        comps.push({ type: 'slab', name: 'Боковина левая', l: 18, w: D, th: H, x: -W/2, y: 0, z: 0, color: '0xc49a6c', rotX: 0, rotY: 0, rotZ: 0 });
        comps.push({ type: 'slab', name: 'Боковина правая', l: 18, w: D, th: H, x: W/2, y: 0, z: 0, color: '0xc49a6c', rotX: 0, rotY: 0, rotZ: 0 });
        comps.push({ type: 'slab', name: 'Крышка', l: W, w: D, th: 18, x: 0, y: H - 18, z: 0, color: '0xc49a6c', rotX: 0, rotY: 0, rotZ: 0 });
        comps.push({ type: 'slab', name: 'Дно', l: W, w: D, th: 18, x: 0, y: 0, z: 0, color: '0xc49a6c', rotX: 0, rotY: 0, rotZ: 0 });
        if (p.shelfHeights.length > 0) {
            p.shelfHeights.forEach((h, i) => {
                if (h < H - 30) comps.push({ type: 'shelf', name: `Полка ${i+1}`, l: W - 36, w: D - 20, th: 18, x: 0, y: h, z: 0, color: '0xd4a373', rotX: 0, rotY: 0, rotZ: 0 });
            });
        } else if (p.shelfCount > 0) {
            const shelfH = H / (p.shelfCount + 1);
            for (let i = 1; i <= p.shelfCount; i++) {
                comps.push({ type: 'shelf', name: `Полка ${i}`, l: W - 36, w: D - 20, th: 18, x: 0, y: shelfH * i, z: 0, color: '0xd4a373', rotX: 0, rotY: 0, rotZ: 0 });
            }
        }
    }
    return comps;
}

function loadSketch(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.getElementById('sketchCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 300; canvas.height = 150;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            document.getElementById('sketchPreview').style.display = 'block';
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function analyzeSketch() {
    document.getElementById('sketchResult').style.display = 'block';
    document.getElementById('sketchResult').innerHTML = '<b>✅ Распознано:</b> Стеллаж 800×400×1800 мм';
    components = buildComponents({ type: 'cabinet', width: 800, depth: 400, height: 1800, shelfCount: 3, shelfHeights: [] });
    renderComponentsList();
    rebuild3D();
    updateUI();
}

function loadTemplate() {
    const t = document.getElementById('template').value;
    if (!t) return;
    if (t === 'simple-table') {
        components = buildComponents({ type: 'table', width: 1200, depth: 600, height: 750 });
    } else if (t === 'chair') {
        components = buildComponents({ type: 'chair', width: 450, depth: 400, height: 800 });
    } else if (t === 'cabinet') {
        components = buildComponents({ type: 'cabinet', width: 800, depth: 500, height: 1800, shelfCount: 3, shelfHeights: [] });
    }
    renderComponentsList();
    rebuild3D();
    updateUI();
}

function createBlockFromSelected() {
    if (selectedComponentIdx < 0) { alert('Выделите компонент в 3D'); return; }
    const comp = components[selectedComponentIdx];
    blocks.push({ name: comp.name + ' (Блок)', componentIndices: [selectedComponentIdx] });
    renderBlocksList();
}

function deleteBlock(idx) {
    blocks.splice(idx, 1);
    renderBlocksList();
}

function renderBlocksList() {
    const d = document.getElementById('blocksList');
    d.innerHTML = blocks.map((b, i) => `<div class="comp-item"><div class="comp-header"><span>${b.name}</span><button class="danger small" onclick="deleteBlock(${i})">✕</button></div></div>`).join('');
}

function renderComponentsList() {
    document.getElementById('compCount').textContent = components.length;
    const d = document.getElementById('componentsList');
    d.innerHTML = components.map((c, i) => `<div class="comp-item" style="cursor:pointer" onclick="selectComponent(${i})"><div class="comp-header"><span>${c.name}</span><span class="badge badge-custom">${c.l}×${c.w}×${c.th}</span></div></div>`).join('');
}

function rebuild3D() {
    while(meshGroup.children.length > 0){ 
        meshGroup.remove(meshGroup.children[0]); 
    }
    meshToComponent.clear();
    clearDimLabels();
    
    components.forEach((c, i) => {
        let yPos = c.y + c.th / 2;
        if (currentView === 'exploded') {
            yPos += i * 40;
        }
        addBox3D(c.x, yPos, c.z, c.l, c.th, c.w, parseInt(c.color), c.rotX, c.rotY, c.rotZ, i);
        if (currentView === 'dimensions') {
            addDimLabel(c.x, yPos, c.z, `${c.l}×${c.w}×${c.th}`);
        }
    });
}

function selectComponent(idx) {
    selectedComponentIdx = idx;
    const comp = components[idx];
    document.getElementById('editPanel').classList.remove('hidden');
    document.getElementById('editName').textContent = comp.name;
    document.getElementById('editL').value = comp.l;
    document.getElementById('editW').value = comp.w;
    document.getElementById('editTh').value = comp.th;
    document.getElementById('editX').value = comp.x;
    document.getElementById('editY').value = comp.y;
    document.getElementById('editZ').value = comp.z;
    document.getElementById('editRotX').value = comp.rotX || 0;
    document.getElementById('editRotY').value = comp.rotY || 0;
    document.getElementById('editRotZ').value = comp.rotZ || 0;
    
    meshGroup.children.forEach(m => {
        if (m.userData.compIdx === idx) {
            selectedMesh = m;
            attachTransformToMesh(m);
        }
    });
}

function closeEditPanel() {
    document.getElementById('editPanel').classList.add('hidden');
    detachTransform();
    selectedComponentIdx = -1;
    selectedMesh = null;
}

function applyEdit() {
    if (selectedComponentIdx < 0) return;
    const c = components[selectedComponentIdx];
    c.l = parseFloat(document.getElementById('editL').value) || c.l;
    c.w = parseFloat(document.getElementById('editW').value) || c.w;
    c.th = parseFloat(document.getElementById('editTh').value) || c.th;
    c.x = parseFloat(document.getElementById('editX').value) || 0;
    c.y = parseFloat(document.getElementById('editY').value) || 0;
    c.z = parseFloat(document.getElementById('editZ').value) || 0;
    c.rotX = parseFloat(document.getElementById('editRotX').value) || 0;
    c.rotY = parseFloat(document.getElementById('editRotY').value) || 0;
    c.rotZ = parseFloat(document.getElementById('editRotZ').value) || 0;
    c.color = document.getElementById('editColor').value;
    rebuild3D();
    renderComponentsList();
}

function deleteSelected() {
    if (selectedComponentIdx < 0) return;
    components.splice(selectedComponentIdx, 1);
    closeEditPanel();
    renderComponentsList();
    rebuild3D();
}

function duplicateSelected() {
    if (selectedComponentIdx < 0) return;
    const clone = JSON.parse(JSON.stringify(components[selectedComponentIdx]));
    clone.x += 50; clone.z += 50;
    clone.name += ' (копия)';
    components.push(clone);
    renderComponentsList();
    rebuild3D();
}

function toggleView(v) {
    currentView = v;
    rebuild3D();
}

function onMeshClick(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(meshGroup.children);
    if (intersects.length > 0) {
        const compIdx = intersects[0].object.userData.compIdx;
        if (compIdx !== undefined) selectComponent(compIdx);
    }
}

function onMeshDblClick(event) {
    onMeshClick(event);
}

function sw(tabId, btn) {
    document.querySelectorAll('.tc').forEach(e => e.classList.remove('a'));
    document.querySelectorAll('.tab').forEach(e => e.classList.remove('a'));
    document.getElementById(tabId).classList.add('a');
    btn.classList.add('a');
}

function updateUI() {
    const tbody = document.getElementById('pT');
    tbody.innerHTML = components.map(c => `<tr><td>${c.name}</td><td>${c.l}</td><td>${c.w}</td><td>${c.th}</td><td>1</td></tr>`).join('');
    
    // Расчет сметы
    let totalCost = 0;
    const hwTBody = document.getElementById('hT');
    let hwHtml = `<tr><td>Конфирмат 5×50</td><td>${components.length * 4}</td><td>2 ₽</td><td>${components.length * 8} ₽</td><td>Крепёж</td></tr>`;
    totalCost += components.length * 8;
    hwTBody.innerHTML = hwHtml;
    
    document.getElementById('totalVal').textContent = totalCost + ' ₽';
    document.getElementById('retailVal').textContent = Math.round(totalCost * 1.8) + ' ₽';
}

function clearAll() {
    components = [];
    blocks = [];
    renderComponentsList();
    renderBlocksList();
    rebuild3D();
    closeEditPanel();
}

function exportCSV() {
    let csv = "Name,Length,Width,Thickness\n" + components.map(c => `${c.name},${c.l},${c.w},${c.th}`).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "furniture_parts.csv";
    link.click();
}

window.onload = () => {
    init3D();
    loadTemplate();
};
</script>
</body>
</html>
