<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор мебели Pro — с ИИ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪑</text></svg>">
<style>
*{box-sizing:border-box}
body{font-family:system-ui;margin:0;display:flex;height:100vh;background:#f8fafc;color:#1e293b;font-size:13px}
.side{width:420px;background:#fff;padding:12px;overflow-y:auto;border-right:1px solid #e2e8f0;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;padding:12px;overflow:hidden;min-width:0}
h2{margin:0 0 10px;font-size:1.1rem;color:#2563eb}
h3{font-size:.85rem;color:#475569;margin:10px 0 5px;border-bottom:1px solid #e2e8f0;padding-bottom:3px}
.fg{margin-bottom:8px}
label{display:block;font-size:.72rem;font-weight:600;margin-bottom:2px;color:#64748b}
input,select,textarea{width:100%;padding:5px;border:1px solid #cbd5e1;border-radius:4px;font-size:.82rem;font-family:inherit}
textarea{resize:vertical;min-height:100px}
.row{display:flex;gap:5px}.row>div{flex:1}
button{width:100%;padding:8px;background:#2563eb;color:#fff;border:none;border-radius:4px;font-weight:600;cursor:pointer;margin-top:5px;font-size:.82rem}
button:hover{background:#1d4ed8}
button.sec{background:#64748b}
button.ai{background:linear-gradient(135deg,#7e22ce,#a855f7)}
button.danger{background:#ef4444}
button.success{background:#10b981}
button.warn{background:#f59e0b}
button.small{width:auto;padding:4px 10px;font-size:.75rem;margin:0}
button.active{background:#10b981 !important}
.btn-row{display:flex;gap:5px;margin-top:5px}
.btn-row button{margin-top:0;flex:1}
#cv{flex:1;background:#e2e8f0;border-radius:6px;min-height:300px;position:relative}
.view-toggle{position:absolute;top:8px;right:8px;z-index:10;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.view-toggle button{width:auto;padding:5px 10px;font-size:.72rem;margin:0}
.tabs{display:flex;gap:2px;margin-bottom:8px;flex-wrap:wrap}
.tab{padding:5px 10px;background:#cbd5e1;border:none;border-radius:4px 4px 0 0;cursor:pointer;font-weight:600;font-size:.78rem}
.tab.a{background:#fff;color:#2563eb}
.tc{display:none;background:#fff;padding:12px;border-radius:0 5px 5px 5px;flex:1;overflow-y:auto}
.tc.a{display:block}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{padding:5px;text-align:left;border-bottom:1px solid #e2e8f0}
th{background:#f1f5f9;font-weight:600;font-size:.72rem}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.sb{background:#f1f5f9;padding:6px;border-radius:4px;text-align:center}
.sv{font-size:.95rem;font-weight:bold;color:#2563eb}
.sl{font-size:.68rem;color:#64748b}
.comp-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:4px;padding:8px;margin-bottom:6px}
.comp-item.hidden-part{opacity:.5}
.comp-header{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.82rem;gap:4px}
.badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:.68rem;font-weight:600}
.badge-custom{background:#c084fc;color:#fff}
.badge-block{background:#10b981;color:#fff}
.edit-panel{position:absolute;bottom:10px;left:10px;right:10px;background:#fff;border:2px solid #2563eb;border-radius:8px;padding:12px;z-index:20;box-shadow:0 4px 20px rgba(0,0,0,0.15);max-height:280px;overflow-y:auto}
.edit-panel.hidden{display:none}
.edit-panel h4{margin:0 0 8px;color:#2563eb;font-size:.95rem}
.edit-panel .row{margin-bottom:6px}
.edit-panel input{padding:4px;font-size:.8rem}
.edit-panel .edit-actions{display:flex;gap:5px;margin-top:8px}
.edit-panel .edit-actions button{flex:1}
.selected-info{position:absolute;top:10px;left:10px;background:#fff;border:1px solid #2563eb;border-radius:6px;padding:6px 12px;font-size:.78rem;z-index:20;max-width:60%}
.selected-info.hidden{display:none}
.hint{position:absolute;bottom:300px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#fff;padding:6px 12px;border-radius:20px;font-size:.75rem;z-index:30;pointer-events:none;max-width:80%}
.hint.warn{background:rgba(153,27,27,0.9)}
.hint.hidden{display:none}
.dim-label{position:absolute;color:#1e293b;font-size:11px;font-weight:bold;background:rgba(255,255,255,0.95);padding:3px 6px;border-radius:3px;border:1px solid #2563eb;pointer-events:none;white-space:nowrap;z-index:100}
.parse-result{background:#d1fae5;border:1px solid #10b981;border-radius:4px;padding:10px;margin-top:8px;font-size:.78rem;display:none}
.parse-result b{color:#065f46}
.parse-result.error{background:#fee2e2;border-color:#ef4444}
.parse-result.error b{color:#7f1d1d}
.parse-result.loading{background:#dbeafe;border-color:#2563eb}
.parse-result.loading b{color:#1e40af}
.example-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{background:#e0e7ff;color:#3730a3;padding:4px 8px;border-radius:12px;font-size:.72rem;cursor:pointer;border:1px solid #c7d2fe}
.chip:hover{background:#c7d2fe}
.transform-controls{position:absolute;top:44px;left:10px;z-index:20;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.transform-controls button{width:auto;padding:6px 12px;font-size:.75rem;margin:0}
.transform-controls select{width:auto;padding:4px;font-size:.72rem}
.cut-warning{background:#fee2e2;border:1px solid #ef4444;border-radius:4px;padding:8px;color:#991b1b;font-size:.78rem;margin-bottom:10px}
.cut-warning b{color:#7f1d1d}
.hist-item{padding:3px 6px;border-radius:3px;cursor:pointer;font-size:.72rem;color:#475569}
.hist-item:hover{background:#e0e7ff}
.hist-item.cur{background:#dbeafe;color:#2563eb;font-weight:600}
.hist-item.future{opacity:.45}
.price-edit{max-height:220px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:4px;padding:6px}
.price-edit .row{margin-bottom:4px}
.price-edit input{padding:3px;font-size:.75rem}
.mat-sel{padding:2px;font-size:.68rem;width:100px}
.ai-config{background:#f5f3ff;border:1px solid #c4b5fd;border-radius:6px;padding:8px;margin-bottom:8px}
.ai-config summary{cursor:pointer;font-weight:600;font-size:.82rem;color:#6d28d9}
.ai-config .row{margin-top:6px}
.ai-config input,.ai-config select{font-size:.75rem;padding:4px}
@media (max-width: 800px){
  body{flex-direction:column}
  .side{width:100%;height:42vh;order:2}
  .main{height:58vh;order:1}
  .edit-panel{max-height:200px}
}
</style>
</head>
<body>

<div class="side">
<h2>🛠️ Конструктор с ИИ</h2>

<div class="btn-row">
<button class="sec" onclick="undo()">↩️ Отменить</button>
<button class="sec" onclick="redo()">↪️ Повторить</button>
</div>
<div id="historyList" style="max-height:90px;overflow-y:auto;margin-bottom:8px;border:1px solid #e2e8f0;border-radius:4px;padding:4px"></div>

<details class="ai-config" open>
<summary>🔑 Настройки ИИ (Ollama)</summary>
<div class="row">
<div>
<label>Провайдер</label>
<select id="aiProvider" onchange="onProviderChange()">
<option value="ollama" selected>Ollama (локально)</option>
<option value="openai">OpenAI</option>
<option value="openrouter">OpenRouter</option>
</select>
</div>
<div>
<label>Модель</label>
<input type="text" id="aiModel" value="qwen2.5:7b" placeholder="qwen2.5:7b">
</div>
</div>
<div class="fg" style="margin-top:6px">
<label>API-ключ (для Ollama оставьте пустым)</label>
<input type="password" id="aiKey" placeholder="sk-...">
</div>
<div class="fg">
<label>URL эндпоинта</label>
<input type="text" id="aiEndpoint" value="http://localhost:11434/v1/chat/completions">
</div>
<div class="btn-row">
<button class="sec small" onclick="saveAIConfig()">💾 Сохранить</button>
<button class="sec small" onclick="testAI()">🧪 Тест</button>
</div>
</details>

<div class="fg">
<label>🤖 Опишите мебель</label>
<textarea id="aiDescription" placeholder="Примеры:
• высокий шкаф для одежды с зеркальными дверцами и 3 полками
• низкая тумба под ТВ с 2 ящиками и открытой полкой
• письменный стол ширина 1200 глубина 600 высота 750"></textarea>
<div class="example-chips">
<span class="chip" onclick="setExample('высокий шкаф для одежды с зеркальными дверцами и 3 полками')">👔 Шкаф с зеркалом</span>
<span class="chip" onclick="setExample('низкая тумба под ТВ с 2 ящиками и открытой полкой')">📺 Тумба под ТВ</span>
<span class="chip" onclick="setExample('письменный стол ширина 1200 глубина 600 высота 750')">💼 Письменный стол</span>
<span class="chip" onclick="setExample('угловой шкаф ширина 2400 глубина 1200 высота 2200, зеркальные фасады')">📐 Угловой шкаф</span>
</div>
<div class="btn-row">
<button class="ai" onclick="buildFromDescription(false)">✨ Построить через ИИ</button>
<button class="sec" onclick="buildFromDescription(true)" title="Без ИИ, только локальный парсер">⚙️ Локально</button>
</div>
<div id="parseResult" class="parse-result"></div>
</div>

<div class="fg">
<label>📋 Или выберите шаблон</label>
<select id="template" onchange="loadTemplate()">
<option value="">— Выберите —</option>
<option value="simple-table">🍽️ Стол</option>
<option value="chair">🪑 Стул</option>
<option value="cabinet">🗄️ Шкаф</option>
<option value="shelf">📚 Стеллаж</option>
<option value="corner">📐 Угловой шкаф</option>
</select>
</div>

<h3>📦 Блоки мебели</h3>
<button class="warn" onclick="createBlockFromSelected()">📦 Создать блок из выделенного</button>
<div id="blocksList" style="margin-top:8px"></div>

<h3>📋 Компоненты (<span id="compCount">0</span>)</h3>
<div class="fg"><input type="text" id="compFilter" placeholder="🔍 Фильтр..." oninput="filterComps(this.value)"></div>
<div id="componentsList"></div>

<div class="fg">
<label>Материал по умолчанию</label>
<select id="material">
<option value="ldsp16">ЛДСП 16 мм</option>
<option value="ldsp18" selected>ЛДСП 18 мм</option>
<option value="ldsp22">ЛДСП 22 мм</option>
<option value="glass">Стекло закалённое</option>
<option value="mirror">Зеркало</option>
<option value="none">Не учитывать</option>
</select>
</div>

<div class="btn-row">
<button class="sec" onclick="exportCSV()">📥 CSV</button>
<button class="sec" onclick="exportDXF()">📐 DXF</button>
</div>
<div class="btn-row">
<button class="sec" onclick="exportJSON()">💾 JSON</button>
<button class="sec" onclick="document.getElementById('jsonImport').click()">📂 Открыть</button>
</div>
<input type="file" id="jsonImport" accept=".json,application/json" style="display:none" onchange="importJSON(event)">
<button class="danger" onclick="clearAll()">🗑️ Очистить</button>
</div>

<div class="main">
<div id="cv">
<div class="hint hidden" id="hint"></div>
<div class="selected-info hidden" id="selectedInfo"></div>
<div class="transform-controls hidden" id="transformControls">
<button class="sec active" id="btnTranslate" onclick="setTransformMode('translate')">↔️ Двигать</button>
<button class="sec" id="btnRotate" onclick="setTransformMode('rotate')">🔄 Вращать</button>
<select id="snapStep" title="Привязка к сетке, мм">
<option value="0">Сетка: выкл</option>
<option value="10">Сетка: 10</option>
<option value="25">Сетка: 25</option>
<option value="50" selected>Сетка: 50</option>
</select>
<button class="sec" onclick="snapToNeighbors()">🧲 К соседям</button>
<button class="sec" onclick="checkCollisions(true)">⚠️ Стыки</button>
<button class="sec" onclick="detachTransform()">✕</button>
</div>
<div class="edit-panel hidden" id="editPanel">
<h4>✏️ Редактирование: <span id="editName"></span></h4>
<div id="editModeIndicator" style="font-size:.75rem;color:#64748b;margin-bottom:8px"></div>
<div class="row">
<div><label>Длина (X)</label><input type="number" id="editL"></div>
<div><label>Ширина (Z)</label><input type="number" id="editW"></div>
<div><label>Высота (Y)</label><input type="number" id="editTh"></div>
</div>
<div class="row">
<div><label>Позиция X</label><input type="number" id="editX"></div>
<div><label>Позиция Y</label><input type="number" id="editY"></div>
<div><label>Позиция Z</label><input type="number" id="editZ"></div>
</div>
<div class="row">
<div><label>Поворот X°</label><input type="number" id="editRotX" step="15" value="0"></div>
<div><label>Поворот Y°</label><input type="number" id="editRotY" step="15" value="0"></div>
<div><label>Поворот Z°</label><input type="number" id="editRotZ" step="15" value="0"></div>
</div>
<div class="row">
<div><label>Материал</label><select id="editMaterial"></select></div>
<div><label>Цвет</label><select id="editColor"></select></div>
</div>
<div class="edit-actions">
<button class="success" onclick="applyEdit()">✅ Применить</button>
<button class="warn" onclick="duplicateSelected()">📄 Копировать</button>
<button class="danger" onclick="deleteSelected()">🗑️ Удалить</button>
<button class="sec" onclick="closeEditPanel()" style="flex:0.5">✕</button>
</div>
</div>
<div class="view-toggle">
<button onclick="toggleView('assembled')">🔧 Собрано</button>
<button onclick="toggleView('exploded')">💥 Разобрано</button>
<button onclick="toggleView('dimensions')">📐 Размеры</button>
</div>
</div>
<div class="tabs">
<button class="tab a" onclick="sw('parts',this)">Детали</button>
<button class="tab" onclick="sw('cut',this)">Раскрой</button>
<button class="tab" onclick="sw('hw',this)">Фурнитура</button>
<button class="tab" onclick="sw('price',this)">💰 Смета</button>
</div>

<div id="parts" class="tc a">
<div class="st" id="pStats"></div>
<table><thead><tr><th>Деталь</th><th>Д×Ш×В</th><th>Материал</th><th>Кол-во</th></tr></thead><tbody id="pT"></tbody></table>
</div>

<div id="cut" class="tc">
<div class="btn-row"><button class="sec" onclick="window.print()">🖨 Печать раскроя</button></div>
<div class="st" id="cStats"></div>
<div id="cMaps"></div>
</div>

<div id="hw" class="tc">
<table><thead><tr><th>Наименование</th><th>Кол-во</th><th>Цена</th><th>Сумма</th><th>Примечание</th></tr></thead><tbody id="hT"></tbody></table>
</div>

<div id="price" class="tc">
<h2>💰 Смета</h2>
<div id="breakdown"></div>
<div style="background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:12px;border-radius:6px;margin-top:10px;text-align:center">
<div>СЕБЕСТОИМОСТЬ</div>
<div style="font-size:1.4rem;font-weight:bold" id="totalVal">0 ₽</div>
<div style="font-size:.82rem;opacity:.8;margin-top:4px">Розничная (×1.8): <b id="retailVal">0 ₽</b></div>
</div>
</div>
</div>

<script>
/* ================= 1. ПРАЙС И МАТЕРИАЛЫ ================= */
const DEFAULT_PRICES = {
    'ЛДСП 16мм (лист 2800×2070)': 2100,
    'ЛДСП 18мм (лист 2800×2070)': 2500,
    'ЛДСП 22мм (лист 2800×2070)': 3200,
    'Кромка ПВХ 2мм': 22,
    'Присадка под конфирмат': 3,
    'Конфирмат 5×50': 2,
    'Петля (шт.)': 120,
    'Ручка': 150,
    'Направляющие для ящика (пара)': 380,
    'Ножка мебельная': 180,
    'Колёсико мебельное': 85,
    'LED подсветка (метр)': 450,
    'Стекло закалённое (м²)': 1800,
    'Зеркало (м²)': 1200
};
let PRICES = Object.assign({}, DEFAULT_PRICES);
function loadPrices(){ try { const s = JSON.parse(localStorage.getItem('furnPrices')); if (s) PRICES = Object.assign({}, DEFAULT_PRICES, s); } catch(e){} }
function savePrices(){ try { localStorage.setItem('furnPrices', JSON.stringify(PRICES)); } catch(e){} }

const MATERIALS = {
    ldsp16:{ name:'ЛДСП 16 мм', sheet:[2800,2070], priceKey:'ЛДСП 16мм (лист 2800×2070)', kind:'sheet' },
    ldsp18:{ name:'ЛДСП 18 мм', sheet:[2800,2070], priceKey:'ЛДСП 18мм (лист 2800×2070)', kind:'sheet' },
    ldsp22:{ name:'ЛДСП 22 мм', sheet:[2800,2070], priceKey:'ЛДСП 22мм (лист 2800×2070)', kind:'sheet' },
    glass:{  name:'Стекло закалённое', kind:'glass' },
    mirror:{ name:'Зеркало', kind:'glass' },
    metal:{  name:'Металл', kind:'metal' },
    none:{   name:'Не учитывать', kind:'none' }
};

const PALETTE = [
    { v:'0xd4a373', n:'Дуб натуральный' }, { v:'0x8b6f47', n:'Венге' }, { v:'0xc49a6c', n:'Ольха' },
    { v:'0xe8e2d4', n:'Белый шагрень' }, { v:'0x3b82f6', n:'Синий' }, { v:'0x10b981', n:'Зелёный' },
    { v:'0x94a3b8', n:'Серый' }, { v:'0xef4444', n:'Красный' }, { v:'0xfbbf24', n:'Жёлтый' },
    { v:'0xa855f7', n:'Фиолетовый' }, { v:'0xc0c0c0', n:'Зеркало' }, { v:'0x87ceeb', n:'Стекло' }
];

/* ================= 2. СОСТОЯНИЕ ================= */
let scene, camera, renderer, meshGroup, controls, transformControl;
let components = [], blocks = [];
let currentView = 'assembled', dimLabels = [];
let meshToComponent = new Map(), selection = new Set(), primaryIdx = -1, selectedBlockIdx = -1, selectedMesh = null;
let raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2(), currentTransformMode = 'translate', downPos = null, filterText = '';
let history = [], histPtr = -1;

function snapshot(label){
    history = history.slice(0, histPtr + 1);
    history.push({ label: label, state: JSON.stringify({ components, blocks }) });
    if (history.length > 60) history.shift();
    histPtr = history.length - 1;
    renderHistory();
    autoSave();
}
function applyHistory(){
    const s = JSON.parse(history[histPtr].state);
    components = s.components; blocks = s.blocks;
    selection.clear(); primaryIdx = -1; selectedMesh = null; selectedBlockIdx = -1;
    detachTransform();
    document.getElementById('editPanel').classList.add('hidden');
    document.getElementById('selectedInfo').classList.add('hidden');
    renderComponentsList(); renderBlocksList(); rebuild3D(); updateUI();
    renderHistory();
}
function undo(){ if (histPtr <= 0) return; histPtr--; applyHistory(); }
function redo(){ if (histPtr >= history.length - 1) return; histPtr++; applyHistory(); }
function jumpHistory(i){ if (i === histPtr) return; histPtr = i; applyHistory(); }
function renderHistory(){
    const el = document.getElementById('historyList');
    el.innerHTML = history.map((h, i) =>
        `<div class="hist-item ${i === histPtr ? 'cur' : (i > histPtr ? 'future' : '')}" onclick="jumpHistory(${i})">${i === histPtr ? '▸ ' : ''}${esc(h.label)}</div>`
    ).join('');
    el.scrollTop = el.scrollHeight;
}

/* ================= 3. УТИЛИТЫ ================= */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function clampSize(v, def){ v = parseFloat(v); return (!isFinite(v)) ? def : Math.max(1, Math.min(6000, v)); }
function debounce(fn, ms){ let t; return function(){ clearTimeout(t); t = setTimeout(fn, ms); }; }
const debouncedRenderList = debounce(() => renderComponentsList(), 400);
function defaultMat(){ return document.getElementById('material').value; }
function setExample(t){ document.getElementById('aiDescription').value = t; }
function showHint(text, warn){
    const h = document.getElementById('hint');
    h.textContent = text; h.classList.toggle('warn', !!warn); h.classList.remove('hidden');
    clearTimeout(showHint._t);
    showHint._t = setTimeout(() => h.classList.add('hidden'), warn ? 4000 : 2500);
}
function autoSave(){
    try { localStorage.setItem('furnProject_autosave', JSON.stringify({ components, blocks, prices: PRICES })); } catch(e){}
}

/* ================= 4. 3D СЦЕНА ================= */
const geoCache = new Map(), lineMatCache = new Map();
function getBoxAssets(sx, sy, sz){
    const k = `b|${sx}|${sy}|${sz}`;
    if (!geoCache.has(k)) { const g = new THREE.BoxGeometry(sx, sy, sz); geoCache.set(k, { geo: g, edges: new THREE.EdgesGeometry(g) }); }
    return geoCache.get(k);
}
function getCylAssets(r, h){
    const k = `c|${r}|${h}`;
    if (!geoCache.has(k)) { const g = new THREE.CylinderGeometry(r, r, h, 16); geoCache.set(k, { geo: g, edges: new THREE.EdgesGeometry(g) }); }
    return geoCache.get(k);
}

function compAABB(c){
    let l = c.l, w = c.w;
    const ry = Math.abs(c.rotY || 0) % 360;
    if (ry === 90 || ry === 270) { const t = l; l = w; w = t; }
    return { minX: c.x - l/2, maxX: c.x + l/2, minZ: c.z - w/2, maxZ: c.z + w/2, minY: c.y, maxY: c.y + c.th };
}

function doSnap(){
    if (primaryIdx < 0 || !selectedMesh) return;
    const step = parseInt(document.getElementById('snapStep').value) || 0;
    const comp = components[primaryIdx]; if (!comp) return;
    if (step > 0) {
        comp.x = Math.round(comp.x / step) * step;
        comp.z = Math.round(comp.z / step) * step;
        comp.y = Math.round(comp.y / step) * step;
    }
    const tol = 15;
    const a = compAABB(comp);
    const solid = components.map((c, i) => ({ c, i })).filter(o => o.i !== primaryIdx && ['slab','shelf','facade'].includes(o.c.type));
    for (const o of solid) {
        const b = compAABB(o.c);
        if (Math.abs(a.maxX - b.minX) < tol && !(a.minZ > b.maxZ || a.maxZ < b.minZ)) { comp.x = b.minX - comp.l/2; break; }
        if (Math.abs(a.minX - b.maxX) < tol && !(a.minZ > b.maxZ || a.maxZ < b.minZ)) { comp.x = b.maxX + comp.l/2; break; }
        if (Math.abs(a.maxZ - b.minZ) < tol && !(a.minX > b.maxX || a.maxX < b.minX)) { comp.z = b.minZ - comp.w/2; break; }
        if (Math.abs(a.minZ - b.maxZ) < tol && !(a.minX > b.maxX || a.maxX < b.minX)) { comp.z = b.maxX + comp.w/2; break; }
        if (Math.abs(a.maxY - b.minY) < tol && !(a.minX > b.maxX || a.maxX < b.minX) && !(a.minZ > b.maxZ || a.maxZ < b.minZ)) { comp.y = b.minY - comp.th; break; }
        if (Math.abs(a.minY - b.maxY) < tol && !(a.minX > b.maxX || a.maxX < b.minX) && !(a.minZ > b.maxZ || a.maxZ < b.minZ)) { comp.y = b.maxY; break; }
    }
    fillEditFields(comp); rebuild3D(); reselectAfterRebuild();
}
function snapToNeighbors(){ if (primaryIdx >= 0) { doSnap(); updateUI(); } }

let colliding = new Set();
function checkCollisions(showMsg){
    const found = new Set();
    const solid = components.map((c, i) => ({ c, i, bb: compAABB(c) })).filter(o => ['slab','shelf','facade','drawer'].includes(o.c.type) && !o.c.hidden);
    for (let i = 0; i < solid.length; i++) for (let j = i + 1; j < solid.length; j++) {
        const a = solid[i].bb, b = solid[j].bb;
        if (a.minX < b.maxX - 2 && a.maxX > b.minX + 2 && a.minZ < b.maxZ - 2 && a.maxZ > b.minZ + 2 && a.minY < b.maxY - 2 && a.maxY > b.minY + 2) {
            found.add(solid[i].i); found.add(solid[j].i);
        }
    }
    colliding = found; refreshHighlight();
    if (showMsg || found.size) showHint(found.size ? `⚠️ Пересекаются деталей: ${found.size}` : '✅ Пересечений нет', found.size > 0);
}

function rotateSelectionAroundCenter(deltaDeg){
    const items = [...selection].map(i => components[i]).filter(Boolean);
    if (!items.length) return;
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    items.forEach(c => { minX = Math.min(minX, c.x); maxX = Math.max(maxX, c.x); minZ = Math.min(minZ, c.z); maxZ = Math.max(maxZ, c.z); });
    const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;
    const r = deltaDeg * Math.PI / 180, cs = Math.cos(r), sn = Math.sin(r);
    items.forEach(c => {
        const dx = c.x - cx, dz = c.z - cz;
        c.x = cx + dx * cs - dz * sn; c.z = cz + dx * sn + dz * cs;
        c.rotY = ((c.rotY || 0) + deltaDeg) % 360;
    });
}

function updateComponentFromTransform(){
    if (primaryIdx < 0 || !selectedMesh) return;
    const comp = components[primaryIdx]; if (!comp) return;
    const mode = transformControl.getMode ? transformControl.getMode() : currentTransformMode;
    const rx = Math.round(selectedMesh.rotation.x * 180 / Math.PI);
    const ry = Math.round(selectedMesh.rotation.y * 180 / Math.PI);
    const rz = Math.round(selectedMesh.rotation.z * 180 / Math.PI);
    if (mode === 'rotate' && selection.size > 1) {
        const prev = selectedMesh.userData.prevRy || 0;
        const delta = ry - prev;
        if (delta !== 0) rotateSelectionAroundCenter(delta);
        selectedMesh.userData.prevRy = ry;
    } else if (mode === 'rotate') {
        comp.rotX = rx; comp.rotY = ry; comp.rotZ = rz;
    } else {
        const dx = selectedMesh.position.x - comp.x;
        const dy = selectedMesh.position.y - comp.th / 2 - comp.y;
        const dz = selectedMesh.position.z - comp.z;
        selection.forEach(i => { const c = components[i]; if (c) { c.x += dx; c.y += dy; c.z += dz; } });
    }
    fillEditFields(comp);
}

const AI_SYSTEM_PROMPT = `Ты — эксперт-конструктор корпусной мебели. Анализируй описание пользователя и возвращай СТРОГО JSON без комментариев, markdown или пояснений.

ПРАВИЛА:

ПРИМЕР ОТВЕТА:
{"type":"cabinet","width":800,"depth":400,"height":2200,"shelves":4,"drawers":2,"hasDoors":true,"hasBack":true,"hasPlinth":false,"hasLegs":false,"isCorner":false,"isMirror":true,"isGlass":false,"hasLed":false,"sections":1}

Верни ТОЛЬКО JSON. Никаких пояснений.`;

async function parseWithAI(text) {
    const model = document.getElementById('aiModel').value || 'qwen2.5:7b';
    const endpoint = document.getElementById('aiEndpoint').value || 'http://localhost:11434/v1/chat/completions';
    const key = document.getElementById('aiKey').value.trim();
    
    const headers = { 'Content-Type': 'application/json' };
    if (key) headers['Authorization'] = `Bearer ${key}`;
    
    const body = {
        model: model,
        messages: [
            { role: 'system', content: AI_SYSTEM_PROMPT },
            { role: 'user', content: text }
        ],
        temperature: 0.1,
        response_format: { type: 'json_object' }
    };
    
    const response = await fetch(endpoint, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(body)
    });
    
    if (!response.ok) {
        const errText = await response.text();
        throw new Error(`API ошибка ${response.status}: ${errText.slice(0, 200)}`);
    }
    
    const data = await response.json();
    
    // Безопасное извлечение ответа (как в curl тесте)
    if (!data.choices || !data.choices[0] || !data.choices[0].message) {
        console.error("Неожиданный ответ от Ollama:", data);
        throw new Error('Ollama вернула неожиданный формат ответа. Проверьте, что модель запущена: ollama run qwen2.5:7b');
    }
    
    let content = data.choices[0].message.content || '';
    
    // Извлекаем только JSON-часть
    const jsonMatch = content.match(/\{[\s\S]*\}/);
    if (!jsonMatch) {
        console.error("Не удалось найти JSON в ответе:", content);
        throw new Error('ИИ не вернул корректный JSON. Ответ: ' + content.slice(0, 100));
    }
    
    return normalizeAIParsed(JSON.parse(jsonMatch[0]));
}

function normalizeAIParsed(p) {
    const validTypes = ['cabinet','low-cabinet','shelf','table','chair','bed','sofa'];
    const type = validTypes.includes(p.type) ? p.type : 'cabinet';
    
    const defaults = {
        'cabinet': { w: 800, d: 500, h: 2200 },
        'low-cabinet': { w: 1200, d: 400, h: 500 },
        'shelf': { w: 800, d: 300, h: 1800 },
        'table': { w: 1200, d: 600, h: 750 },
        'chair': { w: 450, d: 450, h: 850 },
        'bed': { w: 1600, d: 2000, h: 400 },
        'sofa': { w: 2000, d: 900, h: 800 }
    };
    
    const def = defaults[type];
    return {
        type: type,
        width: clampSize(p.width, def.w),
        depth: clampSize(p.depth, def.d),
        height: clampSize(p.height, def.h),
        shelves: Math.max(0, Math.min(20, parseInt(p.shelves) || 0)),
        drawers: Math.max(0, Math.min(10, parseInt(p.drawers) || 0)),
        hasDoors: !!p.hasDoors,
        hasBack: p.hasBack !== false,
        hasPlinth: !!p.hasPlinth,
        hasLegs: !!p.hasLegs,
        isCorner: !!p.isCorner,
        isMirror: !!p.isMirror,
        isGlass: !!p.isGlass,
        hasLed: !!p.hasLed,
        sections: Math.max(1, Math.min(5, parseInt(p.sections) || 1))
    };
}

function parseLocal(text) {
    const t = text.toLowerCase().replace(/,/g, '.');
    let w = null, d = null, h = null;
    
    const extract = (regex) => {
        const m = t.match(regex);
        if (!m) return null;
        let val = parseFloat(m[1].replace(',', '.'));
        const unit = m[2] || '';
        if (unit.includes('м') && !unit.includes('мм')) val *= 1000;
        else if (unit.includes('см')) val *= 10;
        return Math.round(val);
    };
    
    w = extract(/ширин[ауой]?\s*[:=]?\s*(\d+(?:\.\d+)?)\s*(см|мм|м)?/);
    d = extract(/глубин[аеой]?\s*[:=]?\s*(\d+(?:\.\d+)?)\s*(см|мм|м)?/);
    h = extract(/высот[аеой]?\s*[:=]?\s*(\d+(?:\.\d+)?)\s*(см|мм|м)?/);
    
    const dimMatch = t.match(/(\d+(?:\.\d+)?)\s*(см|мм|м)?\s*[хx×]\s*(\d+(?:\.\d+)?)\s*(см|мм|м)?(?:\s*[хx×]\s*(\d+(?:\.\d+)?)\s*(см|мм|м)?)?/);
    if (dimMatch && (!w || !d || !h)) {
        const conv = (v, unit) => {
            const n = parseFloat(String(v).replace(',', '.'));
            if (unit === 'см') return n * 10;
            if (unit === 'м') return n * 1000;
            return n <= 300 ? n * 10 : n;
        };
        const a = conv(dimMatch[1], dimMatch[2]);
        const b = conv(dimMatch[3], dimMatch[4] || dimMatch[2]);
        const c = dimMatch[5] ? conv(dimMatch[5], dimMatch[6] || dimMatch[4] || dimMatch[2]) : null;
        if (c) { const dims = [a, b, c].sort((x, y) => y - x); if (!h) h = dims[0]; if (!w) w = dims[1]; if (!d) d = dims[2]; }
        else { if (!w) w = Math.max(a, b); if (!d) d = Math.min(a, b); }
    }
    
    let type = 'cabinet';
    if (/стол|столик|письменн/.test(t)) type = 'table';
    else if (/стул|кресл/.test(t)) type = 'chair';
    else if (/тумба|комод/.test(t)) type = 'low-cabinet';
    else if (/стеллаж/.test(t)) type = 'shelf';
    else if (/кровать/.test(t)) type = 'bed';
    else if (/диван/.test(t)) type = 'sofa';
    
    return normalizeAIParsed({
        type: type, width: w, depth: d, height: h,
        shelves: parseInt(t.match(/(\d+)\s*(?:полок|полки|полка)/)?.[1] || 0),
        drawers: parseInt(t.match(/(\d+)\s*(?:ящиков|ящика|ящик)/)?.[1] || 0),
        hasDoors: /двер|фасад|купе/.test(t),
        hasBack: /задн/.test(t) && !/без задн/.test(t),
        hasPlinth: /цоколь/.test(t),
        hasLegs: /ножк/.test(t),
        isCorner: /углов/.test(t),
        isMirror: /зеркал/.test(t),
        isGlass: /стекл/.test(t),
        hasLed: /подсветк|led/.test(t),
        sections: parseInt(t.match(/(\d+)\s*(?:секци|отсек)/)?.[1] || 1)
    });
}

async function buildFromDescription(forceLocal = false) {
    const desc = document.getElementById('aiDescription').value.trim();
    if (!desc) { alert('Введите описание мебели'); return; }
    
    const resultDiv = document.getElementById('parseResult');
    resultDiv.style.display = 'block';
    resultDiv.classList.remove('error');
    resultDiv.classList.add('loading');
    resultDiv.innerHTML = '<b>🧠 ИИ анализирует описание...</b>';
    
    let parsed, source;
    
    try {
        if (forceLocal) {
            parsed = parseLocal(desc);
            source = 'локальный парсер';
        } else {
            const key = document.getElementById('aiKey').value.trim();
            const provider = document.getElementById('aiProvider').value;
            if (!key && provider === 'ollama') {
                // Для Ollama ключ не нужен, но если его нет и это не ollama, используем локальный
                parsed = await parseWithAI(desc);
                source = document.getElementById('aiModel').value;
            } else if (!key) {
                parsed = parseLocal(desc);
                source = 'локальный парсер (нет API-ключа)';
            } else {
                parsed = await parseWithAI(desc);
                source = document.getElementById('aiModel').value;
            }
        }
        
        resultDiv.classList.remove('loading');
        resultDiv.innerHTML = `<b>✅ Распознано (${source}):</b><br>` +
            `<pre style="background:#fff;padding:6px;border-radius:4px;font-size:.72rem;overflow-x:auto;margin:4px 0">${esc(JSON.stringify(parsed, null, 2))}</pre>`;
        
        const comps = buildFromSpec(parsed);
        snapshot('Построение: ' + desc.slice(0, 40));
        components = comps; blocks = [];
        deselectAll(); renderComponentsList(); renderBlocksList(); rebuild3D(); updateUI();
        const maxH = Math.max(...comps.map(c => c.y + c.th), 1000);
        camera.position.set(Math.max(2000, maxH), Math.max(1500, maxH), Math.max(2000, maxH));
        controls.target.set(0, maxH / 2, 0);
        
    } catch (err) {
        resultDiv.classList.remove('loading');
        resultDiv.classList.add('error');
        resultDiv.innerHTML = `<b>❌ Ошибка:</b> ${esc(err.message)}<br><small>Попробуйте локальный парсер (кнопка ⚙️) или проверьте, что Ollama запущена.</small>`;
        console.error("AI Build Error:", err);
    }
}

function buildFromSpec(spec) {
    const comps = [];
    const mat = defaultMat();
    const color = spec.isMirror ? '0xc0c0c0' : '0xd4a373';
    const t = 18;
    const w = spec.width, d = spec.depth, h = spec.height;
    
    if (spec.type === 'table') {
        const topTh = 40;
        comps.push(buildBoxC(-w/2, w/2, -d/2, d/2, h-topTh, h, 'slab', 'Столешница', spec.isGlass ? 'glass' : mat, spec.isGlass ? '0x87ceeb' : color));
        const legSize = 50;
        [[-w/2+legSize,-d/2+legSize],[w/2-legSize,-d/2+legSize],[-w/2+legSize,d/2-legSize],[w/2-legSize,d/2-legSize]].forEach((pos, i) => {
            comps.push(buildBoxC(pos[0]-legSize/2, pos[0]+legSize/2, pos[1]-legSize/2, pos[1]+legSize/2, 0, h-topTh, 'leg', `Ножка ${i+1}`, 'metal', '0x94a3b8'));
        });
        return comps;
    }
    
    if (spec.type === 'chair') {
        const seatH = Math.min(h * 0.5, 460);
        comps.push(buildBoxC(-w/2, w/2, -d/2, d/2, seatH, seatH+20, 'slab', 'Сиденье', mat, color));
        const legSize = 40;
        [[-w/2+legSize,-d/2+legSize],[w/2-legSize,-d/2+legSize],[-w/2+legSize,d/2-legSize],[w/2-legSize,d/2-legSize]].forEach((pos, i) => {
            comps.push(buildBoxC(pos[0]-legSize/2, pos[0]+legSize/2, pos[1]-legSize/2, pos[1]+legSize/2, 0, seatH, 'leg', `Ножка ${i+1}`, 'metal', '0x94a3b8'));
        });
        if (h > seatH + 100) {
            comps.push(buildBoxC(-w/2+20, w/2-20, -d/2, -d/2+20, seatH, h, 'slab', 'Спинка', spec.isMirror ? 'mirror' : mat, spec.isMirror ? '0xc0c0c0' : '0xc49a6c'));
        }
        return comps;
    }
    
    if (spec.isCorner) {
        return buildCornerFromSpec(spec, mat, color, t);
    }
    
    comps.push(buildBoxC(-w/2, -w/2+t, -d/2, d/2, 0, h, 'slab', 'Боковина левая', mat, color));
    comps.push(buildBoxC(w/2-t, w/2, -d/2, d/2, 0, h, 'slab', 'Боковина правая', mat, color));
    comps.push(buildBoxC(-w/2+t, w/2-t, -d/2, d/2, 0, t, 'slab', 'Дно', mat, color));
    comps.push(buildBoxC(-w/2+t, w/2-t, -d/2, d/2, h-t, h, 'slab', 'Крышка', mat, color));
    
    const innerW = w - 2*t;
    const innerH = h - 2*t;
    let currentY = t;
    
    if (spec.drawers > 0) {
        const drawerAreaH = Math.min(innerH * 0.5, spec.drawers * 220);
        const drawerH = drawerAreaH / spec.drawers;
        for (let i = 0; i < spec.drawers; i++) {
            const y0 = currentY + i * drawerH + 2;
            const y1 = currentY + (i + 1) * drawerH - 2;
            comps.push(buildBoxC(-w/2+t+5, w/2-t-5, -d/2+10, d/2-10, y0, y1, 'drawer', `Ящик ${i+1}`, mat, '0xe2c79c'));
        }
        currentY += drawerAreaH;
    }
    
    if (spec.shelves > 0) {
        const shelfAreaH = h - t - currentY;
        const spacing = shelfAreaH / (spec.shelves + 1);
        for (let i = 1; i <= spec.shelves; i++) {
            const y = currentY + spacing * i;
            comps.push(buildBoxC(-w/2+t, w/2-t, -d/2+10, d/2-10, y-9, y+9, 'shelf', `Полка ${i}`, spec.isGlass ? 'glass' : mat, spec.isGlass ? '0x87ceeb' : color));
        }
    }
    
    if (spec.hasDoors) {
        const doorMat = spec.isMirror ? 'mirror' : (spec.isGlass ? 'glass' : mat);
        const doorCol = spec.isMirror ? '0xc0c0c0' : (spec.isGlass ? '0x87ceeb' : '0x3b82f6');
        const facadeY0 = t + 10;
        const facadeY1 = h - t - 10;
        if (w > 900) {
            const facadeW = (innerW - 3) / 2;
            comps.push(buildBoxC(-w/2+t, -w/2+t+facadeW, d/2, d/2+20, facadeY0, facadeY1, 'facade', 'Фасад левый', doorMat, doorCol));
            comps.push(buildBoxC(w/2-t-facadeW, w/2-t, d/2, d/2+20, facadeY0, facadeY1, 'facade', 'Фасад правый', doorMat, doorCol));
        } else {
            comps.push(buildBoxC(-w/2+t, w/2-t, d/2, d/2+20, facadeY0, facadeY1, 'facade', 'Фасад', doorMat, doorCol));
        }
    }
    
    if (spec.hasBack) {
        comps.push(buildBoxC(-w/2+5, w/2-5, -d/2+5, -d/2+18, t, h-t, 'slab', 'Задняя стенка (ДВП)', 'none', '0xc49a6c'));
    }
    
    if (spec.hasPlinth) {
        comps.push(buildBoxC(-w/2+40, w/2-40, d/2-10, d/2, 0, 80, 'slab', 'Цоколь передний', mat, color));
    }
    
    if (spec.hasLed) {
        comps.push(buildBoxC(-w/4, w/4, -d/2+20, -d/2+40, h-100, h-80, 'led', 'LED подсветка', 'none', '0xfbbf24'));
    }
    
    return comps;
}

function buildCornerFromSpec(spec, mat, color, t) {
    const comps = [];
    const w = spec.width, d = spec.depth, h = spec.height;
    const d1 = Math.min(d, 600);
    
    comps.push(buildBoxC(-w/2, -w/2+t, -d/2, -d/2+d1, 0, h, 'slab', 'Секция A: Боковина левая', mat, color));
    comps.push(buildBoxC(-d1-t, -d1, -d/2, -d/2+d1, 0, h, 'slab', 'Секция A: Перегородка', mat, color));
    comps.push(buildBoxC(-w/2+t, -d1-t, -d/2, -d/2+d1, 0, t, 'slab', 'Секция A: Дно', mat, color));
    comps.push(buildBoxC(-w/2+t, -d1-t, -d/2, -d/2+d1, h-t, h, 'slab', 'Секция A: Крышка', mat, color));
    
    if (spec.shelves > 0) {
        const shelfCount = Math.ceil(spec.shelves / 2);
        const spacing = (h - 2*t) / (shelfCount + 1);
        for (let i = 1; i <= shelfCount; i++) {
            const y = t + spacing * i;
            comps.push(buildBoxC(-w/2+t, -d1-t, -d/2+10, -d/2+d1-10, y-9, y+9, 'shelf', `Секция A: Полка ${i}`, spec.isGlass ? 'glass' : mat, spec.isGlass ? '0x87ceeb' : color));
        }
    }
    
    comps.push(buildBoxC(-d1-t, -d1, -d/2+d1, d/2, 0, h, 'slab', 'Секция B: Боковина задняя', mat, color));
    comps.push(buildBoxC(-w/2, -w/2+t, -d/2+d1, d/2, 0, h, 'slab', 'Секция B: Боковина правая', mat, color));
    comps.push(buildBoxC(-w/2, -w/2+t, -d/2+d1, d/2, 0, t, 'slab', 'Секция B: Дно', mat, color));
    comps.push(buildBoxC(-w/2, -w/2+t, -d/2+d1, d/2, h-t, h, 'slab', 'Секция B: Крышка', mat, color));
    
    if (spec.shelves > 0) {
        const shelfCount = Math.floor(spec.shelves / 2);
        const spacing = (h - 2*t) / (shelfCount + 1);
        for (let i = 1; i <= shelfCount; i++) {
            const y = t + spacing * i;
            comps.push(buildBoxC(-w/2+10, -w/2+t-10, -d/2+d1, d/2-10, y-9, y+9, 'shelf', `Секция B: Полка ${i}`, spec.isGlass ? 'glass' : mat, spec.isGlass ? '0x87ceeb' : color));
        }
    }
    
    if (spec.hasDoors) {
        const doorMat = spec.isMirror ? 'mirror' : (spec.isGlass ? 'glass' : mat);
        const doorCol = spec.isMirror ? '0xc0c0c0' : (spec.isGlass ? '0x87ceeb' : '0x3b82f6');
        comps.push(buildBoxC(-w/2+t, -d1-t, -d/2+d1, d/2, t+10, h-t-10, 'facade', 'Секция B: Фасад', doorMat, doorCol));
    }
    
    return comps;
}

function buildBoxC(x0, x1, z0, z1, y0, y1, type, name, mat, color){
    return { type, name, l: Math.round(x1 - x0), w: Math.round(z1 - z0), th: Math.round(y1 - y0),
        x: Math.round((x0 + x1) / 2), y: Math.round(y0), z: Math.round((z0 + z1) / 2),
        rotX: 0, rotY: 0, rotZ: 0, color, material: mat, hidden: false };
}

function createBlockFromSelected(){

function deleteBlock(i){

/* ================= 8. ВЫДЕЛЕНИЕ И РЕДАКТИРОВАНИЕ ================= */
function refreshHighlight(){
    meshToComponent.forEach((ci, mesh) => {
        const comp = components[ci]; if (!comp) return;
        mesh.material.color.set(parseInt(comp.color));
        mesh.material.emissive.setHex(colliding.has(ci) ? 0x660000 : (selection.has(ci) ? 0x444400 : 0x000000));
    });
}
function onMeshClick(event){
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(meshGroup.children, false);
    if (hits.length > 0) {
        const ci = hits[0].object.userData.compIdx;
        if (ci !== undefined && ci >= 0) selectComponent(ci, event.shiftKey);
    } else deselectAll();
}
function fillEditFields(comp){
    document.getElementById('editL').value = comp.l; document.getElementById('editW').value = comp.w;
    document.getElementById('editTh').value = comp.th;
    document.getElementById('editX').value = Math.round(comp.x); document.getElementById('editY').value = Math.round(comp.y);
    document.getElementById('editZ').value = Math.round(comp.z);
    document.getElementById('editRotX').value = comp.rotX || 0; document.getElementById('editRotY').value = comp.rotY || 0;
    document.getElementById('editRotZ').value = comp.rotZ || 0;
    document.getElementById('editMaterial').value = comp.material || defaultMat();
    document.getElementById('editColor').value = comp.color;
}
function fillSelects(){
    document.getElementById('editMaterial').innerHTML = Object.keys(MATERIALS).map(k => `<option value="${k}">${MATERIALS[k].name}</option>`).join('');
    document.getElementById('editColor').innerHTML = PALETTE.map(p => `<option value="${p.v}">${p.n}</option>`).join('');
}
function selectComponent(idx, additive){
    if (additive) { if (selection.has(idx)) selection.delete(idx); else selection.add(idx); }
    else selection = new Set([idx]);
    if (selection.size === 0) { deselectAll(); return; }
    if (!selection.has(primaryIdx)) primaryIdx = [...selection][0];
    selectedBlockIdx = -1; refreshHighlight();
    const comp = components[primaryIdx]; if (!comp) return;
    selectedMesh = null;
    meshToComponent.forEach((ci, mesh) => { if (ci === primaryIdx && !selectedMesh) selectedMesh = mesh; });
    if (selectedMesh) selectedMesh.userData.prevRy = Math.round((selectedMesh.rotation.y || 0) * 180 / Math.PI);
    document.getElementById('editName').textContent = comp.name;
    document.getElementById('editModeIndicator').innerHTML = selection.size > 1
        ? `<span class="badge badge-custom">ДЕТАЛЬ</span> ×${selection.size}`
        : '<span class="badge badge-custom">ДЕТАЛЬ</span>';
    fillEditFields(comp); document.getElementById('editPanel').classList.remove('hidden');
    renderComponentsList(); attachTransformToMesh(selectedMesh);
}
function reselectAfterRebuild(){
    if (primaryIdx >= 0) {
        selectedMesh = null;
        meshToComponent.forEach((ci, mesh) => { if (ci === primaryIdx && !selectedMesh) selectedMesh = mesh; });
        if (selectedMesh) { attachTransformToMesh(selectedMesh); selectedMesh.userData.prevRy = Math.round((selectedMesh.rotation.y || 0) * 180 / Math.PI); }
        refreshHighlight();
    }
}
function deselectAll(){
    selection.clear(); primaryIdx = -1; selectedMesh = null; selectedBlockIdx = -1; colliding = new Set();
    refreshHighlight(); detachTransform();
    document.getElementById('editPanel').classList.add('hidden');
    renderComponentsList();
}
function applyEdit(){
    if (selection.size === 0) { alert('Сначала выберите деталь'); return; }
    const primary = components[primaryIdx];
    const nl = clampSize(document.getElementById('editL').value, primary.l);
    const nw = clampSize(document.getElementById('editW').value, primary.w);
    const nth = clampSize(document.getElementById('editTh').value, primary.th);
    const nx = parseFloat(document.getElementById('editX').value), ny = parseFloat(document.getElementById('editY').value), nz = parseFloat(document.getElementById('editZ').value);
    const nrx = parseFloat(document.getElementById('editRotX').value) || 0;
    const nry = parseFloat(document.getElementById('editRotY').value) || 0;
    const nrz = parseFloat(document.getElementById('editRotZ').value) || 0;
    const ncol = document.getElementById('editColor').value;
    const nmat = document.getElementById('editMaterial').value;
    snapshot('Правка деталей ×' + selection.size);
    const dx = isNaN(nx) ? 0 : nx - primary.x;
    const dy = isNaN(ny) ? 0 : ny - primary.y;
    const dz = isNaN(nz) ? 0 : nz - primary.z;
    if (selection.size > 1 && nry !== (primary.rotY || 0)) rotateSelectionAroundCenter(nry - (primary.rotY || 0));
    selection.forEach(i => {
        const c = components[i]; if (!c) return;
        c.l = nl; c.w = nw; c.th = nth;
        c.x += dx; c.y += dy; c.z += dz;
        c.rotX = nrx; c.rotZ = nrz;
        if (selection.size === 1) c.rotY = nry;
        c.color = ncol; c.material = nmat;
    });
    selectedMesh = null; rebuild3D(); renderComponentsList(); updateUI();
    setTimeout(() => reselectAfterRebuild(), 100);
}
function closeEditPanel(){ deselectAll(); }
function duplicateSelected(){
    if (selection.size === 0) return;
    snapshot('Копирование деталей ×' + selection.size);
    const ni = [];
    [...selection].forEach(i => {
        const copy = JSON.parse(JSON.stringify(components[i]));
        copy.name = components[i].name + ' (копия)'; copy.x += 100;
        components.push(copy); ni.push(components.length - 1);
    });
    rebuild3D(); renderComponentsList(); updateUI();
    selection = new Set(ni); primaryIdx = ni[ni.length - 1]; selectComponent(primaryIdx, false);
}
function deleteSelected(){
    if (selection.size === 0) return;
    if (!confirm(`Удалить ${selection.size} дет.?`)) return;
    snapshot('Удаление деталей ×' + selection.size);
    [...selection].sort((a, b) => b - a).forEach(idx => {
        components.splice(idx, 1);
        blocks.forEach(b => { b.componentIndices = b.componentIndices.filter(i => i !== idx).map(i => i > idx ? i - 1 : i); });
    });
    blocks = blocks.filter(b => b.componentIndices.length > 0);
    if (selectedBlockIdx >= blocks.length) selectedBlockIdx = -1;
    deselectAll(); rebuild3D(); renderComponentsList(); updateUI();
}

/* ================= 10. СПИСОК КОМПОНЕНТОВ ================= */
function filterComps(v){ filterText = (v || '').toLowerCase(); renderComponentsList(); }
function toggleHidden(idx, ev){
    ev.stopPropagation(); snapshot((components[idx].hidden ? 'Показ' : 'Скрытие') + ': ' + components[idx].name);
    components[idx].hidden = !components[idx].hidden; rebuild3D(); renderComponentsList(); updateUI();
}
function setCompMaterial(idx, val){
    snapshot('Материал: ' + components[idx].name); components[idx].material = val;
    rebuild3D(); updateUI(); renderComponentsList();
}
function removeComponent(idx){
    snapshot('Удаление: ' + components[idx].name); components.splice(idx, 1);
    blocks.forEach(b => { b.componentIndices = b.componentIndices.filter(i => i !== idx).map(i => i > idx ? i - 1 : i); });
    const shifted = new Set(); selection.forEach(i => shifted.add(i > idx ? i - 1 : i));
    if (selection.has(idx)) shifted.delete(idx > 0 ? idx - 1 : idx);
    selection = shifted;
    if (primaryIdx === idx) primaryIdx = selection.size ? [...selection][0] : -1;
    else if (primaryIdx > idx) primaryIdx--;
    debouncedRenderList(); renderBlocksList(); rebuild3D(); updateUI();
}
function updateComponent(idx, field, value){
    components[idx][field] = field === 'color' || field === 'material' ? value : (isNaN(value) ? value : parseFloat(value));
    if (['l','w','th'].includes(field)) components[idx][field] = clampSize(value, components[idx][field]);
    if (['x','y','z','rotX','rotY','rotZ'].includes(field)) updateMeshTransform(idx);
    else rebuild3D();
    if (primaryIdx === idx && selectedMesh) fillEditFields(components[idx]);
    updateUI(); debouncedRenderList();
}
function updateMeshTransform(idx) {
    const c = components[idx]; if (!c || c.hidden) return;
    let mesh = null; meshToComponent.forEach((mIdx, m) => { if (mIdx === idx) mesh = m; });
    if (mesh) {
        mesh.position.set(c.x, c.y + c.th/2, c.z);
        mesh.rotation.set((c.rotX || 0) * Math.PI / 180, (c.rotY || 0) * Math.PI / 180, (c.rotZ || 0) * Math.PI / 180);
        const targetColor = parseInt(String(c.color).replace('0x', ''), 16);
        if (mesh.material.color.getHex() !== targetColor) mesh.material.color.set(targetColor);
    } else { rebuild3D(); }
}
function renderComponentsList(){
    const list = document.getElementById('componentsList');
    document.getElementById('compCount').textContent = components.length;
    const shown = components.map((c, i) => ({ c, i })).filter(o => !filterText || (o.c.name + ' ' + o.c.type).toLowerCase().includes(filterText));
    if (shown.length === 0) { list.innerHTML = `<p style="color:#64748b;font-size:.78rem">${components.length ? 'Ничего не найдено' : 'Нет компонентов'}</p>`; return; }
    const matOpts = Object.keys(MATERIALS).map(k => `<option value="${k}">${MATERIALS[k].name}</option>`).join('');
    list.innerHTML = shown.map(o => {
        const c = o.c, i = o.i;
        const inBlock = blocks.find(b => b.componentIndices.includes(i));
        return `<div class="comp-item ${c.hidden ? 'hidden-part' : ''}" style="${selection.has(i) ? 'border-color:#2563eb;background:#eff6ff' : ''}"><div class="comp-header"><span class="badge ${inBlock ? 'badge-block' : 'badge-custom'}">${esc(c.type)}${inBlock ? ' 📦' : ''}</span><input type="text" value="${esc(c.name)}" onchange="updateComponent(${i},'name',this.value)" style="flex:1;margin:0 6px;font-size:.78rem"><button class="small" onclick="toggleHidden(${i},event)">${c.hidden ? '🙈' : '👁'}</button><button class="danger small" onclick="removeComponent(${i})">✕</button></div><div class="row"><div><label>Д</label><input type="number" value="${c.l}" onchange="updateComponent(${i},'l',this.value)" style="font-size:.75rem"></div><div><label>Ш</label><input type="number" value="${c.w}" onchange="updateComponent(${i},'w',this.value)" style="font-size:.75rem"></div><div><label>В</label><input type="number" value="${c.th}" onchange="updateComponent(${i},'th',this.value)" style="font-size:.75rem"></div></div><div class="row"><div><label>X</label><input type="number" value="${c.x}" onchange="updateComponent(${i},'x',this.value)" style="font-size:.75rem"></div><div><label>Y</label><input type="number" value="${c.y}" onchange="updateComponent(${i},'y',this.value)" style="font-size:.75rem"></div><div><label>Z</label><input type="number" value="${c.z}" onchange="updateComponent(${i},'z',this.value)" style="font-size:.75rem"></div></div><div class="row"><div><label>Материал</label><select class="mat-sel" onchange="setCompMaterial(${i},this.value)">${matOpts.replace(`value="${c.material||defaultMat()}"`, `value="${c.material||defaultMat()}" selected`)}</select></div></div></div>`;
    }).join('');
}
function clearAll(){
    if (!components.length && !blocks.length) return;
    if (confirm('Очистить всё?')) {
        snapshot('Очистка'); components = []; blocks = [];
        deselectAll(); renderComponentsList(); renderBlocksList(); rebuild3D(); updateUI();
    }
}

/* ================= 11. 3D ПЕРЕСБОРКА ================= */
function rebuild3D(){
    if (transformControl && transformControl.object) { transformControl.detach(); document.getElementById('transformControls').classList.add('hidden'); }
    selectedMesh = null; meshGroup.clear(); meshToComponent.clear(); clearDimLabels();
    components.forEach((c, i) => {
        if (c.hidden) return;
        if (c.type === 'hole' || c.type === 'wheel') addCylinder3D(c.x, c.y + c.th/2, c.z, c.l/2, c.th, parseInt(c.color), i);
        else addBox3D(c.x, c.y + c.th/2, c.z, c.l, c.th, c.w, parseInt(c.color), c.rotX || 0, c.rotY || 0, c.rotZ || 0, i, c.material);
    });
    refreshHighlight();
    if (currentView === 'dimensions') components.forEach(c => { if (!c.hidden) addDimLabel(c.x, c.y + c.th + 50, c.z, `${c.l}×${c.w}×${c.th}`); });
}
function toggleView(mode){
    if (currentView === mode && mode !== 'dimensions') return;
    currentView = mode; clearDimLabels();
    if (mode === 'exploded') {
        meshGroup.children.forEach(m => {
            m.userData.origPos = m.position.clone();
            const dir = new THREE.Vector3(m.position.x, m.position.y - 800, m.position.z).normalize();
            m.position.add(dir.multiplyScalar(300));
        });
    } else {
        meshGroup.children.forEach(m => { if (m.userData.origPos) m.position.copy(m.userData.origPos); });
        if (mode === 'dimensions') rebuild3D();
    }
}
function sw(id, btn){
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('a'));
    document.querySelectorAll('.tc').forEach(t => t.classList.remove('a'));
    btn.classList.add('a'); document.getElementById(id).classList.add('a');
}

/* ================= 12. ДЕТАЛИ, ФУРНИТУРА, КРОМКА ================= */
let currentParts = [], currentHardware = [];

function computeConnections(){
    const solid = components.map((c, i) => ({ c, i, bb: compAABB(c) })).filter(o => ['slab','shelf','facade','drawer'].includes(o.c.type) && !o.c.hidden);
    const pairs = [];
    for (let i = 0; i < solid.length; i++) {
        for (let j = i + 1; j < solid.length; j++) {
            const a = solid[i].bb, b = solid[j].bb;
            const ox = Math.min(a.maxX, b.maxX) - Math.max(a.minX, b.minX);
            const oz = Math.min(a.maxZ, b.maxZ) - Math.max(a.minZ, b.minZ);
            const dy = Math.abs(a.maxY - b.minY);
            const dy2 = Math.abs(b.maxY - a.minY);
            let connected = false;
            if (dy < 3 || dy2 < 3) {
                if (ox > 10 && oz > 10) connected = true;
                else if ((Math.abs(a.maxX - b.minX) < 3 || Math.abs(a.minX - b.maxX) < 3) && oz > 20) connected = true;
                else if ((Math.abs(a.maxZ - b.minZ) < 3 || Math.abs(a.minZ - b.maxZ) < 3) && ox > 20) connected = true;
            }
            if (connected) pairs.push({ c1: solid[i].c, c2: solid[j].c });
        }
    }
    return pairs;
}

function calculateRealEdgeLength(c) {
    if (!['slab','shelf','facade','drawer'].includes(c.type)) return 0;
    let hiddenL_edges = 0, hiddenW_edges = 0;
    const connections = computeConnections();
    connections.forEach(conn => {
        if (conn.c1 === c || conn.c2 === c) {
            const other = conn.c1 === c ? conn.c2 : conn.c1;
            if (Math.abs(c.w - other.w) < 5 && Math.abs(c.z - other.z) < 5) hiddenW_edges++;
            if (Math.abs(c.l - other.l) < 5 && Math.abs(c.x - other.x) < 5) hiddenL_edges++;
        }
    });
    return (2 - Math.min(2, hiddenL_edges)) * c.l + (2 - Math.min(2, hiddenW_edges)) * c.w;
}

function collectHardware(){
    const list = [];
    const add = (n, q, note) => list.push({ n, q, note: note || '' });
    components.forEach(c => {
        if (c.type === 'drawer') { add('Направляющие для ящика (пара)', 1); add('Ручка', 1); }
        if (c.type === 'facade') { add('Петля (шт.)', (c.l > 1200 ? 3 : 2)); add('Ручка', 1); }
        if (c.type === 'led') add('LED подсветка (метр)', Math.round(c.l / 100) / 10);
        if (c.type === 'wheel') add('Колёсико мебельное', 1);
    });
    add('Конфирмат 5×50', computeConnections().length * 4, 'по стыкам');
    const g = {};
    list.forEach(h => { if (!g[h.n]) g[h.n] = { n: h.n, q: 0, note: h.note }; g[h.n].q += h.q; });
    return Object.values(g);
}

function updateUI(){
    currentParts = []; currentHardware = collectHardware();
    components.forEach(c => {
        if (['slab','drawer','shelf','facade'].includes(c.type)) currentParts.push({ n: c.name, l: c.l, w: c.w, th: c.th, q: 1, mat: c.material || defaultMat(), ci: components.indexOf(c) });
        else if (c.type === 'leg') currentParts.push({ n: c.name, l: c.th, w: c.l, th: c.w, q: 1, mat: 'metal', ci: components.indexOf(c) });
    });
    const g = {};
    currentParts.forEach(p => { const k = `${p.n}|${p.l}|${p.w}|${p.th}|${p.mat}`; if (!g[k]) g[k] = { ...p, q: 0, cis: [] }; g[k].q += p.q; g[k].cis.push(p.ci); });
    let tot = 0;
    document.getElementById('pT').innerHTML = Object.values(g).map(p => { tot += p.q; return `<tr><td>${esc(p.n)}</td><td>${p.l}×${p.w}×${p.th}</td><td>${MATERIALS[p.mat] ? MATERIALS[p.mat].name : p.mat}</td><td>${p.q}</td></tr>`; }).join('');
    document.getElementById('pStats').innerHTML = `<div class="sb"><div class="sv">${Object.keys(g).length}</div><div class="sl">Уникальных</div></div><div class="sb"><div class="sv">${tot}</div><div class="sl">Всего деталей</div></div><div class="sb"><div class="sv">${components.length}</div><div class="sl">Компонентов</div></div><div class="sb"><div class="sv">${blocks.length}</div><div class="sl">Блоков</div></div>`;
    document.getElementById('hT').innerHTML = currentHardware.map(h => { const pr = PRICES[h.n] || 0; return `<tr><td>${esc(h.n)}</td><td>${h.q}</td><td>${pr} ₽</td><td><b>${(pr * h.q).toFixed(0)} ₽</b></td><td>${esc(h.note)}</td></tr>`; }).join('');
    runCutting(); calcTotal();
}

/* ================= 13. РАСКРОЙ ================= */
function packSheets(parts, sW, sH, kerf){
    const lost = parts.filter(p => !((p.w <= sW && p.h <= sH) || (p.h <= sW && p.w <= sH)));
    const ok = parts.filter(p => (p.w <= sW && p.h <= sH) || (p.h <= sW && p.w <= sH));
    ok.sort((a, b) => Math.max(b.w, b.h) - Math.max(a.w, a.h) || (b.w * b.h) - (a.w * a.h));
    const sheets = [];
    function findNode(node, w, h) {
        if (node.used) return findNode(node.right, w, h) || findNode(node.down, w, h);
        if (w <= node.w && h <= node.h) return node;
        return null;
    }
    function splitNode(node, w, h) {
        node.used = true;
        node.down = { x: node.x, y: node.y + h + kerf, w: node.w, h: node.h - h - kerf, used: false };
        node.right = { x: node.x + w + kerf, y: node.y, w: node.w - w - kerf, h: h, used: false };
        return node;
    }
    ok.forEach(p => {
        let placed = false;
        for (let sheet of sheets) {
            let node = findNode(sheet.root, p.w, p.h);
            let rotated = false;
            if (!node) { node = findNode(sheet.root, p.h, p.w); if (node) rotated = true; }
            if (node) {
                splitNode(node, rotated ? p.h : p.w, rotated ? p.w : p.h);
                sheet.parts.push({ ...p, x: node.x, y: node.y, rotated, actualW: rotated ? p.h : p.w, actualH: rotated ? p.w : p.h });
                placed = true; break;
            }
        }
        if (!placed) {
            const newSheet = { parts: [], root: { x: 0, y: 0, w: sW, h: sH, used: false } };
            let node = findNode(newSheet.root, p.w, p.h);
            if (node) { splitNode(node, p.w, p.h); newSheet.parts.push({ ...p, x: node.x, y: node.y, rotated: false, actualW: p.w, actualH: p.h }); }
            else {
                const nodeRot = findNode(newSheet.root, p.h, p.w);
                if (nodeRot) { splitNode(nodeRot, p.h, p.w); newSheet.parts.push({ ...p, x: nodeRot.x, y: nodeRot.y, rotated: true, actualW: p.h, actualH: p.w }); }
            }
            sheets.push(newSheet);
        }
    });
    return { sheets, lost };
}

function runCutting(){
    const sW = 2800, sH = 2070, kerf = 4;
    let parts = [];
    currentParts.forEach(p => {
        if (MATERIALS[p.mat] && MATERIALS[p.mat].kind === 'sheet') {
            for (let i = 0; i < p.q; i++) parts.push({ w: p.l, h: p.w, n: p.n, mat: p.mat });
        }
    });
    const { sheets, lost } = packSheets(parts, sW, sH, kerf);
    const scale = 500 / sW; const cMaps = document.getElementById('cMaps'); cMaps.innerHTML = ''; let used = 0;
    if (lost.length > 0) {
        cMaps.innerHTML = `<div class="cut-warning"><b>⚠️ Внимание:</b> Детали не помещаются на лист:<br>` + 
            lost.map(p => `• ${p.n} (${p.w}×${p.h})`).join('<br>') + `</div>`;
    }
    sheets.forEach((s, i) => {
        const d = document.createElement('div'); d.style.cssText = 'border:2px solid #334155;background:#f8fafc;margin-bottom:10px;position:relative';
        d.style.width = (sW * scale) + 'px'; d.style.height = (sH * scale) + 'px';
        s.parts.forEach(p => {
            const e = document.createElement('div');
            e.style.cssText = 'position:absolute;background:#fbbf24;border:1px solid #d97706;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:bold;color:#78350f;overflow:hidden';
            e.style.left = (p.x * scale) + 'px'; e.style.top = (p.y * scale) + 'px';
            e.style.width = (p.actualW * scale) + 'px'; e.style.height = (p.actualH * scale) + 'px';
            e.innerText = `${p.n}\n${p.actualW}×${p.actualH}${p.rotated?' ↻':''}`;
            d.appendChild(e); used += p.actualW * p.actualH;
        });
        const lb = document.createElement('div'); lb.style.cssText = 'position:absolute;top:-20px;font-weight:bold';
        lb.innerText = `Лист ${i + 1}`; d.appendChild(lb); cMaps.appendChild(d);
    });
    const sArea = sW * sH; const eff = sheets.length > 0 ? ((used / (sheets.length * sArea)) * 100).toFixed(1) : 0;
    document.getElementById('cStats').innerHTML = `<div class="sb"><div class="sv">${sheets.length}</div><div class="sl">Листов</div></div><div class="sb"><div class="sv">${eff}%</div><div class="sl">Эффективность</div></div><div class="sb"><div class="sv">${((sheets.length * sArea - used) / 1e6).toFixed(2)} м²</div><div class="sl">Отходы</div></div><div class="sb"><div class="sv">${parts.length}</div><div class="sl">Деталей</div></div>`;
}

/* ================= 14. СМЕТА И ЭКСПОРТ ================= */
function calcTotal(){
    const sW = 2800, sH = 2070; let matCost = 0, edgeCost = 0, hardCost = 0, drillCost = 0;
    let totalArea = 0, totalEdge = 0;
    currentParts.forEach(p => {
        const mat = MATERIALS[p.mat]; if (!mat || mat.kind !== 'sheet') return;
        totalArea += (p.l * p.w * p.q) / 1e6;
        totalEdge += (calculateRealEdgeLength(components[p.cis[0]]) * p.q) / 1000;
    });
    const sheetsNeeded = Math.max(1, Math.ceil(totalArea / ((sW * sH) / 1e6)));
    const matKey = MATERIALS[defaultMat()].priceKey;
    matCost = sheetsNeeded * (PRICES[matKey] || 2500);
    edgeCost = totalEdge * (PRICES['Кромка ПВХ 2мм'] || 22);
    drillCost = currentParts.filter(p => MATERIALS[p.mat] && MATERIALS[p.mat].kind === 'sheet').length * 4 * (PRICES['Присадка под конфирмат'] || 3);
    currentHardware.forEach(h => hardCost += (PRICES[h.n] || 0) * h.q);
    const total = matCost + edgeCost + hardCost + drillCost;
    document.getElementById('breakdown').innerHTML = `
        <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e2e8f0"><span>🪵 Материалы (${sheetsNeeded} л.)</span><b>${matCost.toFixed(0)} ₽</b></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e2e8f0"><span>📏 Кромление (${totalEdge.toFixed(1)} м.п.)</span><b>${edgeCost.toFixed(0)} ₽</b></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e2e8f0"><span>🔧 Присадка</span><b>${drillCost.toFixed(0)} ₽</b></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0"><span>🔩 Фурнитура</span><b>${hardCost.toFixed(0)} ₽</b></div>`;
    document.getElementById('totalVal').textContent = total.toFixed(0) + ' ₽';
    document.getElementById('retailVal').textContent = (total * 1.8).toFixed(0) + ' ₽';
}

function exportCSV(){
    let c = "Компонент,Тип,Длина,Ширина,Высота,X,Y,Z,Материал\n";
    components.forEach(comp => { 
        c += `"${comp.name}","${comp.type}",${comp.l},${comp.w},${comp.th},${comp.x},${comp.y},${comp.z},"${comp.material||defaultMat()}"\n`; 
    });
    const b = new Blob([c], { type: 'text/csv;charset=utf-8;' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'проект.csv'; a.click();
}

function exportDXF(){
    let dxf = "0\nSECTION\n2\nENTITIES\n";
    components.forEach(c => {
        if (c.hidden || c.type === 'leg' || c.type === 'wheel') return;
        const x0 = c.x - c.l/2, x1 = c.x + c.l/2;
        const z0 = c.z - c.w/2, z1 = c.z + c.w/2;
        dxf += `0\nLWPOLYLINE\n8\nLayer_${c.type}\n90\n4\n70\n1\n`;
        dxf += `10\n${x0.toFixed(2)}\n20\n${z0.toFixed(2)}\n`;
        dxf += `10\n${x1.toFixed(2)}\n20\n${z0.toFixed(2)}\n`;
        dxf += `10\n${x1.toFixed(2)}\n20\n${z1.toFixed(2)}\n`;
        dxf += `10\n${x0.toFixed(2)}\n20\n${z1.toFixed(2)}\n`;
    });
    dxf += "0\nENDSEC\n0\nEOF\n";
    const blob = new Blob([dxf], { type: 'application/dxf' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'furniture.dxf'; a.click();
}

function exportJSON(){
    const data = { components, blocks, prices: PRICES };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'project.json'; a.click();
}

function importJSON(event){
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            snapshot('Импорт');
            components = data.components || []; blocks = data.blocks || [];
            if (data.prices) { PRICES = Object.assign({}, DEFAULT_PRICES, data.prices); savePrices(); }
            deselectAll(); renderComponentsList(); renderBlocksList(); rebuild3D(); updateUI();
            showHint('✅ Проект загружен');
        } catch(err) { alert('Ошибка: ' + err.message); }
    };
    reader.readAsText(file);
}

/* ================= 15. ГОРЯЧИЕ КЛАВИШИ ================= */
window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); }
    if (e.key === 'Escape') { deselectAll(); }
    if (e.key === 'g' || e.key === 'G') { duplicateSelected(); }
    if (e.key === 'r' || e.key === 'R') { setTransformMode(currentTransformMode === 'translate' ? 'rotate' : 'translate'); }
});
window.addEventListener('beforeunload', autoSave);

// Запуск
loadPrices();
loadAIConfig();
fillSelects();
init3D();
renderComponentsList();
renderBlocksList();
renderHistory();

try {
    const saved = localStorage.getItem('furnProject_autosave');
    if (saved) {
        const data = JSON.parse(saved);
        if (data.components && data.components.length > 0) {
            components = data.components; blocks = data.blocks || [];
            if (data.prices) PRICES = Object.assign({}, DEFAULT_PRICES, data.prices);
            renderComponentsList(); renderBlocksList(); rebuild3D(); updateUI();
            showHint('✅ Автосохранение восстановлено');
        }
    }
} catch(e) { console.warn('Auto-load failed', e); }
