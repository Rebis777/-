<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Конструктор мебели Pro — 3D-редактор</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;margin:0;display:flex;height:100vh;background:#f8fafc;color:#1e293b;font-size:13px}
.side{width:380px;background:#fff;padding:12px;overflow-y:auto;border-right:1px solid #e2e8f0}
.main{flex:1;display:flex;flex-direction:column;padding:12px;overflow:hidden}
h2{margin:0 0 10px;font-size:1.1rem;color:#2563eb}
h3{font-size:.85rem;color:#475569;margin:10px 0 5px;border-bottom:1px solid #e2e8f0;padding-bottom:3px}
.fg{margin-bottom:8px}
label{display:block;font-size:.72rem;font-weight:600;margin-bottom:2px;color:#64748b}
input,select,textarea{width:100%;padding:5px;border:1px solid #cbd5e1;border-radius:4px;font-size:.82rem;font-family:inherit}
textarea{resize:vertical;min-height:80px}
.row{display:flex;gap:5px}.row>div{flex:1}
button{width:100%;padding:8px;background:#2563eb;color:#fff;border:none;border-radius:4px;font-weight:600;cursor:pointer;margin-top:5px;font-size:.82rem}
button:hover{background:#1d4ed8}
button.sec{background:#64748b}
button.ai{background:linear-gradient(135deg,#7e22ce,#a855f7)}
button.danger{background:#ef4444}
button.success{background:#10b981}
button.warn{background:#f59e0b}
button.small{width:auto;padding:4px 10px;font-size:.75rem;margin:0}
#cv{flex:1;background:#e2e8f0;border-radius:6px;min-height:300px;position:relative}
.view-toggle{position:absolute;top:8px;right:8px;z-index:10;display:flex;gap:4px;flex-wrap:wrap}
.view-toggle button{width:auto;padding:5px 10px;font-size:.72rem;margin:0}
.tabs{display:flex;gap:2px;margin-bottom:8px;flex-wrap:wrap}
.tab{padding:5px 10px;background:#cbd5e1;border:none;border-radius:4px 4px 0 0;cursor:pointer;font-weight:600;font-size:.78rem}
.tab.a{background:#fff;color:#2563eb}
.tc{display:none;background:#fff;padding:12px;border-radius:0 5px 5px 5px;flex:1;overflow-y:auto}
.tc.a{display:block}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{padding:5px;text-align:left;border-bottom:1px solid #e2e8f0}
th{background:#f1f5f9;font-weight:600;font-size:.72rem}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.sb{background:#f1f5f9;padding:6px;border-radius:4px;text-align:center}
.sv{font-size:.95rem;font-weight:bold;color:#2563eb}
.sl{font-size:.68rem;color:#64748b}
.comp-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:4px;padding:8px;margin-bottom:6px}
.comp-header{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.82rem}
.badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:.68rem;font-weight:600}
.badge-custom{background:#c084fc;color:#fff}

/* Панель редактирования выделенной детали */
.edit-panel{position:absolute;bottom:10px;left:10px;right:10px;background:#fff;border:2px solid #2563eb;border-radius:8px;padding:12px;z-index:20;box-shadow:0 4px 20px rgba(0,0,0,0.15);max-height:280px;overflow-y:auto}
.edit-panel.hidden{display:none}
.edit-panel h4{margin:0 0 8px;color:#2563eb;font-size:.95rem}
.edit-panel .row{margin-bottom:6px}
.edit-panel input{padding:4px;font-size:.8rem}
.edit-panel .edit-actions{display:flex;gap:5px;margin-top:8px}
.edit-panel .edit-actions button{flex:1}
.selected-info{position:absolute;top:10px;left:10px;background:#fff;border:1px solid #2563eb;border-radius:6px;padding:6px 12px;font-size:.78rem;z-index:20}
.selected-info.hidden{display:none}
.hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#fff;padding:6px 12px;border-radius:20px;font-size:.75rem;z-index:20;pointer-events:none}
.hint.hidden{display:none}

.dim-label{position:absolute;color:#1e293b;font-size:11px;font-weight:bold;background:rgba(255,255,255,0.95);padding:3px 6px;border-radius:3px;border:1px solid #2563eb;pointer-events:none;white-space:nowrap;z-index:100}
</style>
</head>
<body>

<div class="side">
<h2>️ Конструктор мебели</h2>

<div class="fg">
<label>🤖 Опишите мебель</label>
<textarea id="aiDescription" placeholder="Пример: Стол 1200x600 глубина 600 высота 750 с 2 ящиками"></textarea>
<button class="ai" onclick="generateFromAI()">🤖 Собрать по описанию</button>
</div>

<div class="fg">
<label>📋 Шаблон</label>
<select id="template" onchange="loadTemplate()">
<option value="">— Выберите —</option>
<option value="simple-table">🍽️ Стол</option>
<option value="chair"> Стул</option>
<option value="cabinet">🗄️ Шкаф</option>
</select>
</div>

<h3>✏️ Добавить компонент</h3>
<div class="row">
<div><label>Тип</label>
<select id="compType">
<option value="slab">Плита</option>
<option value="leg">Ножка</option>
<option value="drawer">Ящик</option>
<option value="shelf">Полка</option>
<option value="facade">Фасад</option>
<option value="hole">Отверстие</option>
</select>
</div>
</div>
<div class="row">
<div><label>Длина</label><input type="number" id="compL" value="1000"></div>
<div><label>Ширина</label><input type="number" id="compW" value="600"></div>
<div><label>Высота</label><input type="number" id="compTh" value="20"></div>
</div>
<div class="row">
<div><label>X</label><input type="number" id="compX" value="0"></div>
<div><label>Y</label><input type="number" id="compY" value="0"></div>
<div><label>Z</label><input type="number" id="compZ" value="0"></div>
</div>
<button class="success" onclick="addComponent()">➕ Добавить</button>

<h3> Компоненты (<span id="compCount">0</span>)</h3>
<div id="componentsList"></div>

<div class="fg">
<label>Материал</label>
<select id="material" onchange="updateUI()">
<option value="16">ЛДСП 16 мм</option>
<option value="18" selected>ЛДСП 18 мм</option>
<option value="22">ЛДСП 22 мм</option>
</select>
</div>

<button class="sec" onclick="exportCSV()"> CSV</button>
<button class="danger" onclick="clearAll()">🗑️ Очистить</button>
</div>

<div class="main">
<div id="cv">
<div class="hint" id="hint">💡 Кликните по детали в 3D для редактирования</div>
<div class="selected-info hidden" id="selectedInfo"></div>
<div class="edit-panel hidden" id="editPanel">
<h4> Редактирование: <span id="editName"></span></h4>
<div class="row">
<div><label>Длина (X)</label><input type="number" id="editL"></div>
<div><label>Ширина (Z)</label><input type="number" id="editW"></div>
<div><label>Высота (Y)</label><input type="number" id="editTh"></div>
</div>
<div class="row">
<div><label>Позиция X</label><input type="number" id="editX"></div>
<div><label>Позиция Y</label><input type="number" id="editY"></div>
<div><label>Позиция Z</label><input type="number" id="editZ"></div>
</div>
<div class="row">
<div><label>Поворот °</label><input type="number" id="editRot" step="15"></div>
<div><label>Цвет</label>
<select id="editColor">
<option value="0xd4a373">Дерево светлое</option>
<option value="0x8b6f47">Дерево тёмное</option>
<option value="0x3b82f6">Синий</option>
<option value="0x10b981">Зелёный</option>
<option value="0x94a3b8">Серый</option>
<option value="0xef4444">Красный</option>
</select>
</div>
</div>
<div class="edit-actions">
<button class="success" onclick="applyEdit()">✅ Применить</button>
<button class="warn" onclick="duplicateSelected()"> Копировать</button>
<button class="danger" onclick="deleteSelected()">🗑️ Удалить</button>
</div>
</div>
<div class="view-toggle">
<button onclick="toggleView('assembled')"> Собрано</button>
<button onclick="toggleView('exploded')">💥 Разобрано</button>
<button onclick="toggleView('dimensions')">📐 Размеры</button>
</div>
</div>
<div class="tabs">
<button class="tab a" onclick="sw('parts',this)">Детали</button>
<button class="tab" onclick="sw('cut',this)">Раскрой</button>
<button class="tab" onclick="sw('hw',this)">Фурнитура</button>
<button class="tab" onclick="sw('price',this)">💰 Смета</button>
</div>

<div id="parts" class="tc a">
<div class="st" id="pStats"></div>
<table><thead><tr><th>Деталь</th><th>Длина</th><th>Ширина</th><th>Высота</th><th>Кол-во</th></tr></thead><tbody id="pT"></tbody></table>
</div>

<div id="cut" class="tc">
<div class="st" id="cStats"></div>
<div id="cMaps"></div>
</div>

<div id="hw" class="tc">
<table><thead><tr><th>Наименование</th><th>Кол-во</th><th>Цена</th><th>Сумма</th><th>Примечание</th></tr></thead><tbody id="hT"></tbody></table>
</div>

<div id="price" class="tc">
<h2>💰 Смета</h2>
<div id="breakdown"></div>
<div style="background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:12px;border-radius:6px;margin-top:10px;text-align:center">
<div>СЕБЕСТОИМОСТЬ</div>
<div style="font-size:1.4rem;font-weight:bold" id="totalVal">0 ₽</div>
<div style="font-size:.82rem;opacity:.8;margin-top:4px">Розничная (×1.8): <b id="retailVal">0 ₽</b></div>
</div>
</div>
</div>

<script>
const PRICES = {
    "ЛДСП 16мм (лист 2800×2070)": 2100,
    "ЛДСП 18мм (лист 2800×2070)": 2500,
    "ЛДСП 22мм (лист 2800×2070)": 3200,
    "Кромка ПВХ 0,4мм": 10,
    "Кромка ПВХ 2мм": 22,
    "Присадка под конфирмат": 3,
    "Конфирмат 5×50": 2,
    "Петля рояльная 300мм": 180,
    "Петля рояльная 500мм": 240,
    "Петля рояльная 1000мм": 420,
    "Газлифт 1000N": 850,
    "Кронштейн откидной": 280,
    "Ножка мебельная": 180,
    "Направляющие для ящика (пара)": 380,
    "Ручка для ящика": 120,
    "Вырез под трубу (фрезеровка)": 150,
    "Колёсико мебельное": 85
};

let scene, camera, renderer, meshGroup, controls;
let components = [];
let currentView = 'assembled';
let dimLabels = [];
let meshToComponent = new Map(); // связь mesh ↔ компонент
let selectedComponentIdx = -1;
let selectedMesh = null;
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();

function init3D() {
    const c = document.getElementById('cv');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe2e8f0);
    camera = new THREE.PerspectiveCamera(45, c.clientWidth / c.clientHeight, 1, 10000);
    camera.position.set(2000, 1500, 2000);
    camera.lookAt(0, 800, 0);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(c.clientWidth, c.clientHeight);
    c.appendChild(renderer.domElement);
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 800, 0);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const d = new THREE.DirectionalLight(0xffffff, 0.8);
    d.position.set(1000, 2000, 1000);
    scene.add(d);
    meshGroup = new THREE.Group();
    scene.add(meshGroup);
    scene.add(new THREE.GridHelper(4000, 40, 0x94a3b8, 0xcbd5e1));
    
    // Обработчик клика для выделения деталей
    renderer.domElement.addEventListener('click', onMeshClick);
    renderer.domElement.addEventListener('dblclick', onMeshDblClick);
    
    (function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); updateDimLabels(); })();
    window.addEventListener('resize', () => { camera.aspect = c.clientWidth / c.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(c.clientWidth, c.clientHeight); });
}

function addBox3D(x, y, z, sizeX, sizeY, sizeZ, col, rotY = 0, compIdx = -1) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sizeX, sizeY, sizeZ), new THREE.MeshStandardMaterial({ color: col, roughness: 0.8 }));
    m.position.set(x, y, z);
    if (rotY !== 0) m.rotation.y = rotY * Math.PI / 180;
    m.userData.compIdx = compIdx;
    meshGroup.add(m);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x5c4033 }));
    m.add(edges);
    meshToComponent.set(m, compIdx);
    return m;
}

function addCylinder3D(x, y, z, radius, height, col, compIdx = -1) {
    const geometry = new THREE.CylinderGeometry(radius, radius, height, 16);
    const m = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: col, roughness: 0.8 }));
    m.position.set(x, y, z);
    m.userData.compIdx = compIdx;
    meshGroup.add(m);
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geometry), new THREE.LineBasicMaterial({ color: 0x5c4033 })));
    meshToComponent.set(m, compIdx);
    return m;
}

// ========== ВЫДЕЛЕНИЕ ДЕТАЛЕЙ ==========
function onMeshClick(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(meshGroup.children, false);
    
    if (intersects.length > 0) {
        const mesh = intersects[0].object;
        const compIdx = mesh.userData.compIdx;
        if (compIdx !== undefined && compIdx >= 0) {
            selectComponent(compIdx);
        }
    } else {
        deselectAll();
    }
}

function onMeshDblClick(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(meshGroup.children, false);
    if (intersects.length > 0) {
        const mesh = intersects[0].object;
        const compIdx = mesh.userData.compIdx;
        if (compIdx !== undefined && compIdx >= 0) {
            selectComponent(compIdx);
            // Фокус на детали
            const target = mesh.position.clone();
            controls.target.copy(target);
        }
    }
}

function selectComponent(idx) {
    // Снять выделение с предыдущей
    if (selectedMesh && selectedMesh.material) {
        const comp = components[selectedComponentIdx];
        if (comp) selectedMesh.material.color.set(parseInt(comp.color));
        selectedMesh.material.emissive = new THREE.Color(0x000000);
    }
    
    selectedComponentIdx = idx;
    const comp = components[idx];
    if (!comp) return;
    
    // Найти mesh этого компонента
    selectedMesh = null;
    meshToComponent.forEach((cIdx, mesh) => {
        if (cIdx === idx && !selectedMesh) selectedMesh = mesh;
    });
    
    // Подсветка
    if (selectedMesh) {
        selectedMesh.material.emissive = new THREE.Color(0x333300);
    }
    
    // Показать панель редактирования
    document.getElementById('editName').textContent = comp.name;
    document.getElementById('editL').value = comp.l;
    document.getElementById('editW').value = comp.w;
    document.getElementById('editTh').value = comp.th;
    document.getElementById('editX').value = comp.x;
    document.getElementById('editY').value = comp.y;
    document.getElementById('editZ').value = comp.z;
    document.getElementById('editRot').value = comp.rotY || 0;
    document.getElementById('editColor').value = comp.color;
    
    document.getElementById('editPanel').classList.remove('hidden');
    document.getElementById('hint').classList.add('hidden');
    
    const info = document.getElementById('selectedInfo');
    info.classList.remove('hidden');
    info.innerHTML = `<b>Выбрано:</b> ${comp.name} <span style="color:#64748b">(${comp.l}×${comp.w}×${comp.th})</span>`;
}

function deselectAll() {
    if (selectedMesh && selectedMesh.material) {
        const comp = components[selectedComponentIdx];
        if (comp) selectedMesh.material.color.set(parseInt(comp.color));
        selectedMesh.material.emissive = new THREE.Color(0x000000);
    }
    selectedComponentIdx = -1;
    selectedMesh = null;
    document.getElementById('editPanel').classList.add('hidden');
    document.getElementById('selectedInfo').classList.add('hidden');
    document.getElementById('hint').classList.remove('hidden');
}

function applyEdit() {
    if (selectedComponentIdx < 0) return;
    const comp = components[selectedComponentIdx];
    comp.l = parseFloat(document.getElementById('editL').value) || 0;
    comp.w = parseFloat(document.getElementById('editW').value) || 0;
    comp.th = parseFloat(document.getElementById('editTh').value) || 0;
    comp.x = parseFloat(document.getElementById('editX').value) || 0;
    comp.y = parseFloat(document.getElementById('editY').value) || 0;
    comp.z = parseFloat(document.getElementById('editZ').value) || 0;
    comp.rotY = parseFloat(document.getElementById('editRot').value) || 0;
    comp.color = document.getElementById('editColor').value;
    
    // Мгновенное обновление
    rebuild3D();
    renderComponentsList();
    updateUI();
    
    // Сохранить выделение
    setTimeout(() => selectComponent(selectedComponentIdx), 50);
}

function duplicateSelected() {
    if (selectedComponentIdx < 0) return;
    const orig = components[selectedComponentIdx];
    const copy = JSON.parse(JSON.stringify(orig));
    copy.name = orig.name + ' (копия)';
    copy.x += 100;
    components.push(copy);
    rebuild3D();
    renderComponentsList();
    updateUI();
    selectComponent(components.length - 1);
}

function deleteSelected() {
    if (selectedComponentIdx < 0) return;
    if (!confirm(`Удалить "${components[selectedComponentIdx].name}"?`)) return;
    components.splice(selectedComponentIdx, 1);
    deselectAll();
    rebuild3D();
    renderComponentsList();
    updateUI();
}

// ========== ОСТАЛЬНОЙ КОД ==========
function clearDimLabels() { dimLabels.forEach(l => l.remove()); dimLabels = []; }
function addDimLabel(x, y, z, text) {
    const cv = document.getElementById('cv');
    const label = document.createElement('div');
    label.className = 'dim-label';
    label.textContent = text;
    cv.appendChild(label);
    dimLabels.push({ label, pos: new THREE.Vector3(x, y, z) });
}
function updateDimLabels() {
    if (currentView !== 'dimensions') { clearDimLabels(); return; }
    const cv = document.getElementById('cv');
    const w = cv.clientWidth, h = cv.clientHeight;
    dimLabels.forEach(item => {
        const v = item.pos.clone();
        v.project(camera);
        const x = (v.x * .5 + .5) * w;
        const y = (-v.y * .5 + .5) * h;
        if (v.z > 1) { item.label.style.display = 'none'; return; }
        item.label.style.display = 'block';
        item.label.style.left = (x - item.label.offsetWidth / 2) + 'px';
        item.label.style.top = (y - item.label.offsetHeight / 2) + 'px';
    });
}

// ========== AI ПАРСЕР ==========
function generateFromAI() {
    const desc = document.getElementById('aiDescription').value.trim();
    if (!desc) { alert('Введите описание'); return; }
    const t = desc.toLowerCase();
    const comps = [];
    
    const dimPattern = /(\d{2,4})\s*[×xх*]\s*(\d{2,4})/g;
    let match;
    const dims = [];
    while ((match = dimPattern.exec(t)) !== null) dims.push({ a: parseInt(match[1]), b: parseInt(match[2]) });
    
    const heights = [];
    const hPattern = /высот[аеой]\s*(\d{2,4})/g;
    while ((match = hPattern.exec(t)) !== null) heights.push(parseInt(match[1]));
    
    const depths = [];
    const dPattern = /глубин[аеой]\s*(\d{2,4})/g;
    while ((match = dPattern.exec(t)) !== null) depths.push(parseInt(match[1]));
    
    const counts = {};
    const cPattern = /(\d+)\s*(ящик|полк|ножк|опор)/g;
    while ((match = cPattern.exec(t)) !== null) counts[match[2]] = parseInt(match[1]);
    
    let type = 'table';
    if (t.includes('шкаф')) type = 'cabinet';
    else if (t.includes('стул') || t.includes('кресло')) type = 'chair';
    else if (t.includes('полк') && !t.includes('шкаф')) type = 'shelf';
    else if (t.includes('скамейк')) type = 'bench';
    else if (t.includes('тумб') || t.includes('комод')) type = 'cabinet';
    
    const d = dims[0] || { a: 1200, b: 600 };
    const depth = depths[0] || d.b || 600;
    const height = heights[0] || 750;
    
    if (type === 'table' || type === 'bench') {
        comps.push({ type: 'slab', name: 'Столешница', l: d.a, w: depth, th: 20, x: 0, y: height - 20, z: 0, color: '0xd4a373', note: '', rotY: 0 });
        const legPositions = [[-d.a/2+50,-depth/2+50],[d.a/2-50,-depth/2+50],[-d.a/2+50,depth/2-50],[d.a/2-50,depth/2-50]];
        const legCount = counts['ножк'] || counts['опор'] || 4;
        for (let i = 0; i < Math.min(legCount, 4); i++) {
            comps.push({ type: 'leg', name: `Опора ${i+1}`, l: 50, w: 50, th: height - 20, x: legPositions[i][0], y: 0, z: legPositions[i][1], color: '0x94a3b8', note: '', rotY: 0 });
        }
    } else if (type === 'chair') {
        comps.push({ type: 'slab', name: 'Сиденье', l: d.a, w: depth, th: 20, x: 0, y: height - 20, z: 0, color: '0xd4a373', note: '', rotY: 0 });
        const legPositions = [[-d.a/2+30,-depth/2+30],[d.a/2-30,-depth/2+30],[-d.a/2+30,depth/2-30],[d.a/2-30,depth/2-30]];
        legPositions.forEach((pos, i) => {
            comps.push({ type: 'leg', name: `Ножка ${i+1}`, l: 40, w: 40, th: height - 20, x: pos[0], y: 0, z: pos[1], color: '0x94a3b8', note: '', rotY: 0 });
        });
        if (t.includes('спинк')) {
            comps.push({ type: 'slab', name: 'Спинка', l: 20, w: depth - 40, th: 400, x: 0, y: height, z: -depth/2 + 20, color: '0xc49a6c', note: '', rotY: 0 });
        }
    } else if (type === 'cabinet') {
        comps.push({ type: 'slab', name: 'Боковина левая', l: 18, w: depth, th: height, x: -d.a/2, y: 0, z: 0, color: '0xc49a6c', note: '', rotY: 0 });
        comps.push({ type: 'slab', name: 'Боковина правая', l: 18, w: depth, th: height, x: d.a/2, y: 0, z: 0, color: '0xc49a6c', note: '', rotY: 0 });
        comps.push({ type: 'slab', name: 'Крышка', l: d.a, w: depth, th: 18, x: 0, y: height - 18, z: 0, color: '0xc49a6c', note: '', rotY: 0 });
        comps.push({ type: 'slab', name: 'Дно', l: d.a, w: depth, th: 18, x: 0, y: 0, z: 0, color: '0xc49a6c', note: '', rotY: 0 });
        const shelfCount = counts['полк'] || 3;
        if (shelfCount > 0) {
            const shelfH = height / (shelfCount + 1);
            for (let i = 1; i <= shelfCount; i++) {
                comps.push({ type: 'shelf', name: `Полка ${i}`, l: d.a - 36, w: depth - 20, th: 18, x: 0, y: shelfH * i, z: 0, color: '0xd4a373', note: '', rotY: 0 });
            }
        }
        if (t.includes('фасад') || t.includes('дверц')) {
            comps.push({ type: 'facade', name: 'Фасад', l: 20, w: d.a - 4, th: height - 40, x: 0, y: 20, z: depth/2, color: '0x3b82f6', note: '', rotY: 0 });
        }
    } else if (type === 'shelf') {
        comps.push({ type: 'slab', name: 'Полка', l: d.a, w: depth, th: 20, x: 0, y: height, z: 0, color: '0xd4a373', note: '', rotY: 0 });
        comps.push({ type: 'bracket', name: 'Кронштейн левый', l: 40, w: 40, th: 250, x: -d.a/2 + 50, y: height - 200, z: 0, color: '0x94a3b8', note: '', rotY: 0 });
        comps.push({ type: 'bracket', name: 'Кронштейн правый', l: 40, w: 40, th: 250, x: d.a/2 - 50, y: height - 200, z: 0, color: '0x94a3b8', note: '', rotY: 0 });
    }
    
    const drawerCount = counts['ящик'] || 0;
    if (drawerCount > 0) {
        const drawerH = (height - 36) / drawerCount;
        for (let i = 0; i < drawerCount; i++) {
            comps.push({ type: 'drawer', name: `Ящик ${i+1}`, l: d.a - 36, w: depth - 36, th: drawerH - 20, x: 0, y: 18 + i * drawerH + 10, z: 0, color: '0xe2c79c', note: '', rotY: 0 });
        }
    }
    
    components = comps;
    renderComponentsList();
    rebuild3D();
    updateUI();
}

function addComponent() {
    const type = document.getElementById('compType').value;
    const l = parseInt(document.getElementById('compL').value) || 0;
    const w = parseInt(document.getElementById('compW').value) || 0;
    const th = parseInt(document.getElementById('compTh').value) || 0;
    const x = parseInt(document.getElementById('compX').value) || 0;
    const y = parseInt(document.getElementById('compY').value) || 0;
    const z = parseInt(document.getElementById('compZ').value) || 0;
    const rot = parseInt(document.getElementById('compRot').value) || 0;
    const color = document.getElementById('compColor').value;
    const typeNames = { 'slab': 'Плита', 'leg': 'Ножка', 'drawer': 'Ящик', 'shelf': 'Полка', 'facade': 'Фасад', 'hole': 'Отверстие' };
    components.push({ type, name: `${typeNames[type]} #${components.length + 1}`, l, w, th, x, y, z, rotY: rot, color, note: '' });
    renderComponentsList();
    rebuild3D();
    updateUI();
}

function removeComponent(idx) {
    components.splice(idx, 1);
    if (selectedComponentIdx === idx) deselectAll();
    else if (selectedComponentIdx > idx) selectedComponentIdx--;
    renderComponentsList();
    rebuild3D();
    updateUI();
}

function updateComponent(idx, field, value) {
    components[idx][field] = field === 'color' ? value : (isNaN(value) ? value : parseFloat(value));
    if (['l','w','th','x','y','z','rotY','color'].includes(field)) {
        rebuild3D();
        if (selectedComponentIdx === idx) setTimeout(() => selectComponent(idx), 50);
    }
    updateUI();
}

function renderComponentsList() {
    const list = document.getElementById('componentsList');
    document.getElementById('compCount').textContent = components.length;
    if (components.length === 0) { list.innerHTML = '<p style="color:#64748b;font-size:.78rem">Добавьте первый компонент</p>'; return; }
    list.innerHTML = components.map((c, i) => `
        <div class="comp-item" style="${selectedComponentIdx === i ? 'border-color:#2563eb;background:#eff6ff' : ''}">
            <div class="comp-header">
                <span class="badge badge-custom">${c.type}</span>
                <input type="text" value="${c.name}" onchange="updateComponent(${i},'name',this.value)" style="flex:1;margin:0 8px;font-size:.78rem">
                <button class="danger small" onclick="removeComponent(${i})">✕</button>
            </div>
            <div class="row">
                <div><label>Длина</label><input type="number" value="${c.l}" onchange="updateComponent(${i},'l',this.value)" style="font-size:.75rem"></div>
                <div><label>Ширина</label><input type="number" value="${c.w}" onchange="updateComponent(${i},'w',this.value)" style="font-size:.75rem"></div>
                <div><label>Высота</label><input type="number" value="${c.th}" onchange="updateComponent(${i},'th',this.value)" style="font-size:.75rem"></div>
            </div>
            <div class="row">
                <div><label>X</label><input type="number" value="${c.x}" onchange="updateComponent(${i},'x',this.value)" style="font-size:.75rem"></div>
                <div><label>Y</label><input type="number" value="${c.y}" onchange="updateComponent(${i},'y',this.value)" style="font-size:.75rem"></div>
                <div><label>Z</label><input type="number" value="${c.z}" onchange="updateComponent(${i},'z',this.value)" style="font-size:.75rem"></div>
            </div>
        </div>
    `).join('');
}

function clearAll() {
    if (confirm('Очистить все компоненты?')) { components = []; deselectAll(); renderComponentsList(); rebuild3D(); updateUI(); }
}

// ========== 3D ПЕРЕСБОРКА ==========
function rebuild3D() {
    meshGroup.clear();
    meshToComponent.clear();
    clearDimLabels();
    
    components.forEach((c, i) => {
        if (c.type === 'hole') {
            addCylinder3D(c.x, c.y + c.th/2, c.z, c.l/2, c.th, parseInt(c.color), i);
        } else if (c.type === 'slab' || c.type === 'drawer' || c.type === 'shelf' || c.type === 'facade') {
            addBox3D(c.x, c.y + c.th/2, c.z, c.l, c.th, c.w, parseInt(c.color), c.rotY, i);
        } else if (c.type === 'leg') {
            addBox3D(c.x, c.y + c.th/2, c.z, c.l, c.th, c.w, parseInt(c.color), c.rotY, i);
        } else if (c.type === 'bracket') {
            addBox3D(c.x, c.y + c.th/2, c.z, c.l, c.th, c.w, parseInt(c.color), c.rotY, i);
        }
    });
    
    if (currentView === 'dimensions') {
        components.forEach(c => {
            addDimLabel(c.x, c.y + c.th + 50, c.z, `${c.l}×${c.w}×${c.th}`);
        });
    }
}

function toggleView(mode) {
    currentView = mode;
    clearDimLabels();
    if (mode === 'exploded') {
        meshGroup.children.forEach(m => {
            m.userData.origPos = m.position.clone();
            const dir = new THREE.Vector3(m.position.x, m.position.y - 800, m.position.z).normalize();
            m.position.add(dir.multiplyScalar(300));
        });
    } else if (mode === 'assembled') {
        meshGroup.children.forEach(m => { if (m.userData.origPos) m.position.copy(m.userData.origPos); });
    } else if (mode === 'dimensions') {
        meshGroup.children.forEach(m => { if (m.userData.origPos) m.position.copy(m.userData.origPos); });
        rebuild3D();
    }
}

function sw(id, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('a'));
    document.querySelectorAll('.tc').forEach(t => t.classList.remove('a'));
    btn.classList.add('a');
    document.getElementById(id).classList.add('a');
}

let currentParts = [], currentHardware = [];

function updateUI() {
    currentParts = []; currentHardware = [];
    components.forEach(c => {
        if (c.type === 'slab' || c.type === 'drawer' || c.type === 'shelf' || c.type === 'facade') currentParts.push({ n: c.name, l: c.l, w: c.w, th: c.th, q: 1, mat: `ЛДСП ${document.getElementById('material').value}мм` });
        else if (c.type === 'leg') currentParts.push({ n: c.name, l: c.th, w: c.l, th: c.w, q: 1, mat: 'Металл' });
        else if (c.type === 'hole') currentParts.push({ n: c.name, l: c.l, w: c.w, th: c.th, q: 1, mat: 'Фрезеровка' });
        
        if (c.type === 'drawer') currentHardware.push({ n: 'Направляющие для ящика (пара)', q: 1, note: '' });
        if (c.type === 'drawer') currentHardware.push({ n: 'Ручка для ящика', q: 1, note: '' });
    });
    const g = {};
    currentParts.forEach(p => { const k = `${p.n}|${p.l}|${p.w}|${p.th}`; if (!g[k]) g[k] = { ...p, q: 0 }; g[k].q += p.q; });
    let tot = 0;
    document.getElementById('pT').innerHTML = Object.values(g).map(p => { tot += p.q; return `<tr><td>${p.n}</td><td>${p.l}</td><td>${p.w}</td><td>${p.th}</td><td>${p.q}</td></tr>`; }).join('');
    document.getElementById('pStats').innerHTML = `<div class="sb"><div class="sv">${Object.keys(g).length}</div><div class="sl">Уникальных</div></div><div class="sb"><div class="sv">${tot}</div><div class="sl">Всего деталей</div></div><div class="sb"><div class="sv">${components.length}</div><div class="sl">Компонентов</div></div><div class="sb"><div class="sv">${document.getElementById('material').value}мм</div><div class="sl">Материал</div></div>`;
    document.getElementById('hT').innerHTML = currentHardware.map(h => { const pr = PRICES[h.n] || 0; return `<tr><td>${h.n}</td><td>${h.q}</td><td>${pr} ₽</td><td><b>${(pr * h.q).toFixed(0)} ₽</b></td><td>${h.note}</td></tr>`; }).join('');
    runCutting(); calcTotal();
}

function runCutting() {
    const sW = 2800, sH = 2070, kerf = 4;
    let parts = [];
    currentParts.forEach(p => { if (p.mat && p.mat.includes('ЛДСП')) for (let i = 0; i < p.q; i++) parts.push({ w: p.l, h: p.w, n: p.n }); });
    parts.sort((a, b) => (b.w * b.h) - (a.w * a.h));
    const sheets = []; let cur = { p: [], fr: [{ x: 0, y: 0, w: sW, h: sH }] };
    parts.forEach(pt => { let placed = false; for (let s of sheets) if (tryP(s, pt, kerf)) { placed = true; break; } if (!placed) { if (tryP(cur, pt, kerf)) { sheets.push(cur); cur = { p: [], fr: [{ x: 0, y: 0, w: sW, h: sH }] }; } } });
    if (cur.p.length) sheets.push(cur);
    const scale = 500 / sW; const cMaps = document.getElementById('cMaps'); cMaps.innerHTML = ''; let used = 0;
    sheets.forEach((s, i) => { const d = document.createElement('div'); d.style.cssText = 'border:2px solid #334155;background:#f8fafc;margin-bottom:10px;position:relative'; d.style.width = (sW * scale) + 'px'; d.style.height = (sH * scale) + 'px'; s.p.forEach(p => { const e = document.createElement('div'); e.style.cssText = 'position:absolute;background:#fbbf24;border:1px solid #d97706;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:bold;color:#78350f;overflow:hidden'; e.style.left = (p.x * scale) + 'px'; e.style.top = (p.y * scale) + 'px'; e.style.width = (p.w * scale) + 'px'; e.style.height = (p.h * scale) + 'px'; e.innerText = `${p.n}\n${p.w}×${p.h}`; d.appendChild(e); used += p.w * p.h; }); const lb = document.createElement('div'); lb.style.cssText = 'position:absolute;top:-20px;font-weight:bold'; lb.innerText = `Лист ${i + 1}`; d.appendChild(lb); cMaps.appendChild(d); });
    const sArea = sW * sH; const eff = sheets.length > 0 ? ((used / (sheets.length * sArea)) * 100).toFixed(1) : 0;
    document.getElementById('cStats').innerHTML = `<div class="sb"><div class="sv">${sheets.length}</div><div class="sl">Листов</div></div><div class="sb"><div class="sv">${eff}%</div><div class="sl">Эффективность</div></div><div class="sb"><div class="sv">${((sheets.length * sArea - used) / 1e6).toFixed(2)} м²</div><div class="sl">Отходы</div></div><div class="sb"><div class="sv">${parts.length}</div><div class="sl">Деталей</div></div>`;
}

function tryP(s, pt, k) { for (let i = 0; i < s.fr.length; i++) { const r = s.fr[i]; if (pt.w <= r.w && pt.h <= r.h) { pl(s, pt, r, k, false); return true; } if (pt.h <= r.w && pt.w <= r.h) { pl(s, pt, r, k, true); return true; } } return false; }
function pl(s, pt, r, k, rot) { const w = rot ? pt.h : pt.w, h = rot ? pt.w : pt.h; s.p.push({ x: r.x, y: r.y, w, h, n: pt.n }); s.fr.splice(s.fr.indexOf(r), 1); if (r.w - w - k > 0) s.fr.push({ x: r.x + w + k, y: r.y, w: r.w - w - k, h }); if (r.h - h - k > 0) s.fr.push({ x: r.x, y: r.y + h + k, w: r.w, h: r.h - h - k }); s.fr.sort((a, b) => (a.y - b.y) || (a.x - b.x)); }

function calcTotal() {
    const sW = 2800, sH = 2070; let matCost = 0, edgeCost = 0, hardCost = 0, drillCost = 0;
    let totalArea = 0;
    currentParts.forEach(p => { if (!p.mat || !p.mat.includes('ЛДСП')) return; totalArea += (p.l * p.w * p.q) / 1e6; const edgeLm = ((p.l * 2 * 2 + p.w * 2 * 2) * p.q) / 1000; edgeCost += edgeLm * PRICES["Кромка ПВХ 2мм"]; });
    const sheetsNeeded = Math.max(1, Math.ceil(totalArea / ((sW * sH) / 1e6)));
    const matKey = `ЛДСП ${document.getElementById('material').value}мм (лист 2800×2070)`;
    matCost = sheetsNeeded * PRICES[matKey];
    drillCost = currentParts.filter(p => p.mat && p.mat.includes('ЛДСП')).length * 4 * PRICES["Присадка под конфирмат"];
    currentHardware.forEach(h => hardCost += (PRICES[h.n] || 0) * h.q);
    const total = matCost + edgeCost + hardCost + drillCost;
    document.getElementById('breakdown').innerHTML = `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e2e8f0"><span>🪵 Материалы (${sheetsNeeded} л.)</span><b>${matCost.toFixed(0)} ₽</b></div><div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e2e8f0"><span>📏 Кромление</span><b>${edgeCost.toFixed(0)} ₽</b></div><div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e2e8f0"><span>🔧 Присадка</span><b>${drillCost.toFixed(0)} ₽</b></div><div style="display:flex;justify-content:space-between;padding:4px 0"><span>🔩 Фурнитура</span><b>${hardCost.toFixed(0)} ₽</b></div>`;
    document.getElementById('totalVal').textContent = total.toFixed(0) + ' ₽';
    document.getElementById('retailVal').textContent = (total * 1.8).toFixed(0) + ' ₽';
}

function exportCSV() {
    let c = "Компонент,Тип,Длина,Ширина,Высота,X,Y,Z,Поворот\n";
    components.forEach(comp => { c += `${comp.name},${comp.type},${comp.l},${comp.w},${comp.th},${comp.x},${comp.y},${comp.z},${comp.rotY||0}\n`; });
    const b = new Blob([c], { type: 'text/csv;charset=utf-8;' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'проект.csv'; a.click();
}

// ========== ЗАПУСК ==========
init3D();
renderComponentsList();
document.getElementById('template').value = 'simple-table';
loadTemplate();
</script>
